# The documentation estate Trancendos is meant to hold.
#
# Read by scripts/check_docs_estate.py, which reports which entries exist and
# which do not. It is a contract, not a wish list: an entry here that nobody
# can point at is a gap, and an entry satisfied by a file that says nothing is
# worse than a gap, because it closes the question.
#
# `satisfied_by` is a list of repo-relative paths or glob patterns. The first
# that exists satisfies the entry. `status` records whether the artefact is
# live — wired to something that runs — or descriptive.
#
# Provenance: the required set is the Trancendos Forward Pack estate proposed
# 2026-09-04, reconciled against the 210 markdown documents already under
# docs/. Most of it was already built; the gaps below are what the
# reconciliation actually found.

meta:
  version: "1.0.0"
  reconciled: "2026-09-04"
  source: "Trancendos Forward Pack proposal, mapped onto the existing estate"

sections:
  governance:
    - id: GOV-CHARTER
      title: Governance charter and constitution
      satisfied_by: ["docs/governance/AI-GOVERNANCE-CONSTITUTION.md"]
      status: live
    - id: GOV-CONTROL-CATALOGUE
      title: Control catalogue
      satisfied_by:
        - "docs/governance/CODE-COMPLIANCE-MATRIX.md"
        - "compliance/register.yaml"
      status: live
    - id: GOV-RISK-TIERING
      title: Risk tiering procedure
      satisfied_by: ["docs/governance/AI-AGENT-BOT-TIER-MATRIX.md"]
      status: live
      note: >-
        The tiers are also code — RiskTier in src/compliance/ai_governance.py,
        mapped to EU AI Act Article 5 and Annex III, and now the input to
        src/gates/decision.py.
    - id: GOV-EXCEPTIONS
      title: Exception and suppression management
      satisfied_by: ["SECURITY_ALERT_REGISTER.md"]
      status: live
      note: >-
        Dispositions are enforced by scripts/check_trivyignore_governance.py
        and src/security/accepted_risk_register.py.
    - id: GOV-AUDIT-EXPORT
      title: Audit export standard
      satisfied_by: ["docs/governance/INTERNAL-AUDIT-PROGRAMME.md"]
      status: descriptive
      note: No machine-readable export format is defined yet.
    - id: GOV-ACCESSIBILITY
      title: Accessibility standards
      satisfied_by: ["docs/governance/ACCESSIBILITY-STANDARDS.md"]
      status: descriptive
      note: >-
        Nothing verifies it. Neither CI tree runs axe, pa11y or Lighthouse,
        and Fabulousa has no accessibility endpoint — see the creative route
        table's design.accessibility capability, recorded ABSENT.

  architecture:
    - id: ARCH-OF-RECORD
      title: Architecture of record
      satisfied_by: ["CLAUDE.md", "docs/architecture/*.md"]
      status: live
    - id: ARCH-THREAT-MODEL
      title: Threat model
      satisfied_by: ["ARCHITECTURE_THREAT_MODEL.md"]
      status: descriptive
    - id: ARCH-DEPLOYMENT-MODES
      title: Cloud / hybrid / sovereign deployment profiles
      satisfied_by: ["docs/architecture/infrastructure-modes.md"]
      status: live
      note: >-
        Definitions exist and PlatformInfraMode is code, but only ten files
        branch on the mode.
    - id: ARCH-SERVICE-REVIEW
      title: Service inventory and review
      satisfied_by: ["docs/architecture/SERVICE-REVIEW.md"]
      status: live
      note: Generated by scripts/build_service_review.py and drift-checked in CI.
    - id: ARCH-FORENSIC
      title: Forensic assessment of the delivery path
      satisfied_by: ["docs/architecture/FORENSIC-ASSESSMENT-CREATIVE-DELIVERY.md"]
      status: live

  orchestration:
    - id: ORC-GATE-ENGINE
      title: Deterministic gate engine specification
      satisfied_by: ["docs/governance/GATE-ENGINE.md"]
      status: live
      note: >-
        Implemented by src/gates/decision.py — five decisions, risk-tiered
        fail-closed, deterministic.
    - id: ORC-PLM-GATES
      title: Product lifecycle gate criteria
      satisfied_by: ["docs/governance/PLM-GATES.md"]
      status: live
      note: Generated from src/townhall/plm.py and drift-checked in CI.
    - id: ORC-CREATIVE-ROUTING
      title: Which Location answers a creative request
      satisfied_by: ["src/creative/routing.py"]
      status: live
      note: Verified against deployed entrypoints by scripts/check_creative_routes.py.
    - id: ORC-LOCATION-FLOW
      title: Location-to-Location flow contract
      satisfied_by: ["docs/governance/LOCATION-FLOW-CONTRACT.md"]
      status: live
      note: Measured by scripts/flow_conformance.py against a ratcheted baseline.
    - id: ORC-AGENT-REGISTRY
      title: Agent registry — owners, versions, risk tiers, tools
      satisfied_by: ["docs/governance/AI-BOM.md"]
      status: descriptive
      note: >-
        An AI bill of materials exists. It does not carry per-agent tool
        scopes, approval points or evaluation suites.
    - id: ORC-MODEL-ADAPTER
      title: Model adapter contract
      satisfied_by: ["src/ai_gateway/"]
      status: live
    - id: ORC-MCP-GATEWAY
      title: MCP governance gateway
      satisfied_by: []
      status: missing
      note: >-
        The Spark serves MCP without a governance mediation layer, so an
        external MCP client inherits no policy from Trancendos.

  operations:
    - id: OPS-RUNBOOKS
      title: Operational runbooks
      satisfied_by: ["docs/runbooks/*.md", "docs/DEPLOYMENT_RUNBOOK.md"]
      status: live
    - id: OPS-OBSERVABILITY
      title: Observability standard
      satisfied_by: ["docs/governance/OBSERVABILITY-AND-AUTOMATION-GOVERNANCE.md"]
      status: descriptive
    - id: OPS-QUOTA-EXHAUSTION
      title: Quota exhaustion runbook and budget ledger
      satisfied_by: []
      status: missing
      note: >-
        The zero-cost posture depends on staying inside free-tier limits and
        nothing measures the burn rate or degrades before it is reached.
    - id: OPS-PROMPT-INJECTION
      title: Prompt injection runbook
      satisfied_by: []
      status: missing

  assurance:
    - id: ASR-DVMS
      title: Dependency and vulnerability management
      satisfied_by: ["docs/governance/DVMS-ENTITY-FLOW.md"]
      status: live
    - id: ASR-SUPPLY-CHAIN
      title: Supply chain security
      satisfied_by: ["docs/governance/AI-BOM.md", "docs/governance/BOM-MATRIX.md"]
      status: live
    - id: ASR-EVALUATION
      title: Evaluation framework — golden sets, adversarial tests, thresholds
      satisfied_by: []
      status: missing
      note: >-
        The Chaos Party runs suites. Nothing defines a golden dataset, a
        scoring rubric or a release threshold, so no promotion is gated on
        model quality.
    - id: ASR-RELEASE-GOVERNANCE
      title: Release governance
      satisfied_by: ["docs/cab/*.md"]
      status: live

  templates:
    - id: TPL-INDEX
      title: Template index
      satisfied_by: ["docs/templates/INDEX.md"]
      status: descriptive
      note: One file. The templates it indexes are largely elsewhere or absent.
    - id: TPL-MANAGEMENT-REVIEW
      title: Management review
      satisfied_by: ["docs/governance/MANAGEMENT-REVIEW-TEMPLATE.md"]
      status: live
    - id: TPL-CHANGE-REQUEST
      title: Change request
      satisfied_by: ["docs/change-request-process.md"]
      status: live
    - id: TPL-AGENT-DESIGN
      title: Agent design document
      satisfied_by: []
      status: missing
    - id: TPL-ADR
      title: Architecture decision record
      satisfied_by: []
      status: missing
      note: >-
        Decisions are recorded in commit messages and CLAUDE.md prose. Neither
        is addressable by a control id.
    - id: TPL-INCIDENT
      title: AI incident report
      satisfied_by: []
      status: missing
      note: >-
        src/compliance/ai_governance.py logs AIIncident records; no report
        template exists for the human half.
    - id: TPL-DPIA
      title: DPIA screening
      satisfied_by: ["docs/privacy/*.md"]
      status: descriptive

  commercial:
    - id: COM-COST-GOVERNANCE
