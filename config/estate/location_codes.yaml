# Reference codes issued to Locations, for `src/library/references.py`.
#
# APPEND-ONLY. A code here has been issued: documents, citations and printed
# material carry references built from it, and changing one breaks every
# reference already using it. Derivation alone could not guarantee that —
# it extends a code only as far as the current register requires, so adding
# a Location beginning "Tran" would push `Tranc` to `Trance` and silently
# invalidate every `Tranc-KB-0001` in existence.
#
# Add a Location by appending its derived code. Never edit or remove one;
# `tests/test_library_references.py` fails if you do.
