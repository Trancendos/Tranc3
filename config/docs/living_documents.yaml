  - id: runtime-library-review
    title: Runtime Library review and publication
    canonical: docs/DOCUMENT_LIFECYCLE.md
    kind: explanation
    owner: Chief Knowledge Officer
    source_paths:
      - src/library/knowledge_base.py
      - src/library/routes.py
      - src/library/bridge.py
