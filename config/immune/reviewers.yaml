# Which reviewers this estate's pull requests actually depend on.
#
# This manifest exists for the same reason `sensors.yaml` does. Nine bots post
# on a pull request here, and most of them are not reviewing it: one posts a
# merge-queue checkbox, one posts coverage deltas, one posts a greeting. If
# "somebody commented" counted as "somebody reviewed", then a pull request whose
# every real reviewer was out of credits would read as covered -- which is the
# exact false-clean `src/immune/reviewers.py` was written to stop, and which the
# first live run of it did report until this file existed.
#
# So coverage is measured against a written decision, never inferred from who
# happened to comment. With no `depends_on` entry matched, the tool reports its
# observations and says coverage is UNDETERMINED rather than guessing.
#
# Measured 2026-10-05: of the 6 `depends_on` reviewers below, three were
# simultaneously unable to review (credits, quota, subscription) across the four
# most recent pull requests. On #1372 `sourcery-ai` was the only one that
# reviewed, and it found five real defects.
#
# That count is checked against the list by `tests/test_immune_reviewers.py`.
# It said "five" against eight entries when this file was written, which is the
# same defect the rest of this estate guards numbers against -- a figure stated
# once beside a list that then grew.

# Reviewers whose silence on a defect is meant to mean something.
depends_on:
  sourcery-ai[bot]: "Reads the diff and reports defects; found 5 real ones on #1372"
  coderabbitai[bot]: "Line-level review with reachability analysis; rate-limited on the free OSS tier"
  cubic-dev-ai[bot]: "AI code review"
  codeant-ai[bot]: "AI code review"
  qodo-code-review[bot]: "AI code review; subscription currently inactive"
  devloai[bot]: "Custom review agent; currently out of credits"

# Reviewers that review when asked and post nothing otherwise. Depending on
# these would guarantee they read SILENT or UNPROVEN on every pull request
# nobody summoned them to -- which is not blindness and should not be reported
# as a coverage gap. Raised by `llamapreview[bot]` on #1373, correctly: a
# reviewer whose declared default is "no review" cannot be one whose silence
# means something.
on_request:
  chatgpt-codex-connector[bot]: "Reviews on @codex review, or on open/ready-for-review"
  google-labs-jules[bot]: "Reviews on request"
  llamapreview[bot]: "Open-source reviewer; posted blocking findings on #1373"

# Bots that comment on pull requests and are NOT reviewing them. Listed
# explicitly, with what each actually does, because leaving them unlisted is
# what let a merge-queue checkbox count as review coverage.
not_a_reviewer:
  mergify[bot]: "Merge-queue control checkbox -- posts no finding of any kind"
  codecov[bot]: "Coverage delta report, not a defect review"
  pre-commit-ci[bot]: "Formatter; rewrites files rather than reporting on them"
  ecc-tools[bot]: "Posts taxonomy and evidence audits, but cannot publish them as checks"
  dependabot[bot]: "Opens dependency pull requests"
  renovate[bot]: "Opens dependency pull requests"
  dosubot[bot]: "Answers questions; does not review the diff"
  github-actions[bot]: "Runs workflows"
