# Trancendos Capital Governance Binding
#
# The binding file Magna Carta's generic capital-governance layer requires
# every adopter to supply (compliance/magna-carta/compliance/capital_governance.yaml,
# `binding` section). Maps each generic role_id to a real Trancendos actor,
# names the real currency unit, and names the real ledger per function type.
#
# This file does not relax any control — ledger_separation, demotion,
# kill_switches, and evidence stay exactly as the generic register defines
# them (binding.must_not_override). It only fills in who/what plays each
# role and what the tier bands' "units" mean in real money.
#
# Structural fields (location, location_abbrev, lead_ai/lead_ais) are kept
# separate from prose (detail) specifically so a future validator can check
# them against src/entities/platform.py directly — location_abbrev matches
# LOCATION_ABBREVS, lead_ai/lead_ais matches LocationEntity.lead_ai(s) —
# rather than having to parse free text to find the actual binding.
#
# Structural validation of this file (role_disjointness, distinct_ledgers)
# is staged to Magna Carta's Stage 7.2 binding validator, which doesn't
# exist yet — the generic register's own binding.constraints section says
# so explicitly for both constraints. This is the first binding file for
# that validator to check once it lands; until then, the reasoning below
# is stated but not machine-enforced.

meta:
  version: "1.1.0"
  created: "2026-08-01"
  owner: "Andrew Porter"
  adopting_platform: "Trancendos"
  source_register: "compliance/magna-carta/compliance/capital_governance.yaml"

unit_currency: "GBP"

actor_for_each_role_id:
  capital_operator:
    location: "Arcadian Exchange"
    location_abbrev: "AEX"
    lead_ais:
      - "Clarence Porter"
      - "Ann Porter"
      - "George Porter"
      - "Edward Porter"
      - "James Porter"
    detail: >
      Arcadian Exchange's five Lead AIs (src/entities/platform.py,
      PLATFORM_ENTITIES["Arcadian Exchange"].lead_ais — the list above matches
      that field exactly), each running its own Speculator-X/Trader-X agent
      pair (agent_teams). Collectively the automated actor that proposes and
      executes capital actions under this register; every one of Clarence,
      Ann, George, Edward & James Porter is subject to the same tier limits
      and constraints.
  risk_authority:
    location: "Royal Bank of Arcadia"
    location_abbrev: "RBA"
    lead_ai: "Dorris Fontaine"
    detail: >
      Royal Bank of Arcadia's Lead AI — the platform's financial hub for
      billing and payments. Evaluates a proposed capital action against
      tier limits and exposure caps before it reaches a venue, per this
      role's own description in the generic register ("between operator
      and execution, never beside it"). Same actor as presiding_authority
      below; role_disjointness only requires risk_authority differ from
      capital_operator, which holds here (Dorris Fontaine is not one of
      Clarence, Ann, George, Edward & James Porter, i.e. not in
      capital_operator.lead_ais above).
  presiding_authority:
    location: "Royal Bank of Arcadia"
    location_abbrev: "RBA"
    lead_ai: "Dorris Fontaine"
    detail: >
      Already Arcadian Exchange's own escalation authority in the platform
      entity table — Royal Bank of Arcadia is named in Arcadian Exchange's
      `primes` field (src/entities/platform.py) independently of this
      binding, so this assignment matches an existing cross-Location
      relationship rather than inventing a new one. Differs from
      capital_operator (Clarence, Ann, George, Edward & James Porter),
      satisfying role_disjointness.
  human_owner:
    human_name: "Andrew Porter"
    is_automated_actor: false
    detail: >
      The platform's actual human founder/owner. Terminal authority: sole
      releaser of any hard kill switch, sole approver of the
      simulated-to-live transition. is_automated_actor: false is the
      structural fact role_disjointness' human_owner requirement checks —
      not simply implied by the human_name field being a person's name.

ledger_identifier_per_function_type:
  INTERNAL:
    identifier: "royal-bank-arcadia.operating-ledger"
    backing_worker: "workers/ledger-service/"
    backing_worker_port: 8032
  EXTERNAL:
    identifier: "arcadian-exchange.trading-ledger"
    backing_worker: "workers/ledger-service/"
    backing_worker_port: 8032
  # identifier values are distinct (satisfies distinct_ledgers' literal
  # requirement); backing_worker/backing_worker_port are equal today —
  # both route through the one ledger-service worker that exists
  # (port 8032, "Royal Bank ledger" per CLAUDE.md), since no separate
  # service exists yet for Arcadian Exchange specifically. That shared
  # backing is stated as an explicit field, not left implicit in prose,
  # so a future validator (or a human auditor) can see the real
  # infrastructure gap at a glance: distinct ledger *records* today,
  # not yet distinct ledger *infrastructure* — true separation is a
  # Stage 7.x concern once real money moves through this.

# The generic register states two binding constraints now, with structural
# validation staged to 7.2 (see the file-level comment above):
#   - role_disjointness: presiding_authority (Dorris Fontaine / RBA) differs
#     from capital_operator (Clarence, Ann, George, Edward & James Porter /
#     AEX); risk_authority (Dorris Fontaine / RBA) differs from
#     capital_operator; human_owner (Andrew Porter) has
#     is_automated_actor: false.
#   - distinct_ledgers: INTERNAL and EXTERNAL identifier values above are
#     distinct strings, checkable by direct string comparison.
