# .pre-commit-config.yaml
# Local security enforcement before every commit.
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files
# Updated: 2026-05 — Proactive Remediation & Automation

# Hooks that cannot run inside pre-commit.ci's sandbox: it has no network
# access and installs nothing from this repository. Each is still enforced
# elsewhere — semgrep, safety and the security scanner in
# .forgejo/workflows/security-scan.yml, the EA workbook in the Service
# Topology job of .github/workflows/ci.yml.
ci:
  skip:
    - semgrep
    - python-safety-dependencies-check
    - validate-ea-workbook
    - security-scanner
    - security-autofix

repos:
  # ── Ruff (lint + format) ──────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.8
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # ── General file checks ───────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # Kubernetes/Flux manifests bundle several documents per file.
        args: [--allow-multiple-documents]
      - id: check-json
        # VS Code settings are JSONC: comments are valid there, and
        # check-json only understands strict JSON.
        exclude: ^\.vscode/
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: check-ast
      - id: debug-statements

  # ── Bandit (Python SAST) ──────────────────────────────────────────
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        # medium+ severity, matching the gate in
        # .forgejo/workflows/security-scan.yml. Low findings are tracked by
        # the ratchet in security-baseline.yml instead of blocking a commit.
        args: [-c, pyproject.toml, -ll, --confidence-level, medium, -r, src, api.py]
        # Scan the configured targets rather than the changed-file list:
        # pre-commit's filenames bypass [tool.bandit] exclude_dirs, which
        # dragged tests/ and scripts/ into every run.
        pass_filenames: false
        additional_dependencies: ["bandit[toml]"]

  # ── Semgrep (semantic code analysis) ──────────────────────────────
  - repo: https://github.com/semgrep/pre-commit
    rev: v1.63.0
    hooks:
      - id: semgrep
        args: ["--config", "auto", "--error"]

  # ── Secrets detection ─────────────────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]

  # ── Dependency safety ─────────────────────────────────────────────
  - repo: https://github.com/Lucas-C/pre-commit-hooks-safety
    rev: v1.3.3
    hooks:
      - id: python-safety-dependencies-check
        files: requirements.*\.txt$

  # ── Typo detection (security-sensitive) ───────────────────────────
  - repo: https://github.com/crate-ci/typos
    rev: v1.31.1
    hooks:
      - id: typos
        args: [--config, .typos.toml]
        # Generated third-party artefacts. .typos.toml's files.extend-exclude
        # is ignored when pre-commit passes explicit paths, so the exclusion
        # has to be repeated here.
        exclude: ^(reports/|\.security_learning/|\.security_telemetry/|\.secrets\.baseline$)

  # ── EA/CMDB workbook integrity ────────────────────────────────────
  - repo: local
    hooks:
      - id: validate-ea-workbook
        name: Validate EA workbook CSV integrity
        entry: python scripts/validate_ea_workbook.py
        language: system
        files: ^docs/architecture/ea-workbook/.*\.csv$
        pass_filenames: false

  # ── Proactive Security Scanner (AST-based CodeQL pattern prevention) ────
  # Blocks the exact patterns that caused ~297 CodeQL alerts from ever
  # landing in the codebase again. Maps to CWE-022, CWE-117, CWE-209,
  # CWE-327, PY-001–PY-009.
  - repo: local
    hooks:
      - id: security-scanner
        name: Proactive Security Scanner
        entry: python -m Dimensional.security_automation gate
        language: system
        types: [python]
        pass_filenames: false
        args: [--max-critical, "0", --max-high, "0", --max-medium, "20", src/ Dimensional/ workers/]
        verbose: true
      - id: security-autofix
        name: Security Auto-Fix (dry-run check)
        entry: python -m Dimensional.security_automation fix
        language: system
        types: [python]
        pass_filenames: false
        args: [--dry-run, src/ Dimensional/ workers/]
        verbose: true
