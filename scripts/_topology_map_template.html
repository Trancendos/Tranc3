<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trancendos Platform Topology</title>
<style>
  :root {
    --bg: #eef1f8;
    --surface: #ffffff;
    --surface-2: #f4f6fb;
    --border: #d6dcea;
    --text: #171b26;
    --text-dim: #5b6478;
    --accent: #3860e0;
    --accent-soft: #3860e022;
    --status-core: #6b7280;
    --status-modularize: #c9820f;
    --status-risk: #d1414a;
    --status-safe: #1f9d63;
    --status-removed: #9aa3b8;
    --status-stale: #d1414a;
    --status-unclassified: #7c88a6;
    --suite: #7c5cd6;
    --canvas-bg: #e4e9f4;
    --focus: #3860e0;
    font-family: -apple-system, "Segoe UI", "Inter", ui-sans-serif, system-ui, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b0e14;
      --surface: #131826;
      --surface-2: #1b2233;
      --border: #2a3346;
      --text: #e4e8f1;
      --text-dim: #8b95ac;
      --accent: #6f96ff;
      --accent-soft: #6f96ff22;
      --status-core: #8b93a3;
      --status-modularize: #f5a623;
      --status-risk: #ff5c5c;
      --status-safe: #4ade80;
      --status-removed: #5b6478;
      --status-stale: #ff5c5c;
      --status-unclassified: #8b95ac;
      --suite: #a78bfa;
      --canvas-bg: #0e1220;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b0e14;
    --surface: #131826;
    --surface-2: #1b2233;
    --border: #2a3346;
    --text: #e4e8f1;
    --text-dim: #8b95ac;
    --accent: #6f96ff;
    --accent-soft: #6f96ff22;
    --status-core: #8b93a3;
    --status-modularize: #f5a623;
    --status-risk: #ff5c5c;
    --status-safe: #4ade80;
    --status-removed: #5b6478;
    --status-stale: #ff5c5c;
    --status-unclassified: #8b95ac;
    --suite: #a78bfa;
    --canvas-bg: #0e1220;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .mono { font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace; }

  header {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 12px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.02em;
    margin: 0;
    white-space: nowrap;
  }
  header .sub {
    font-size: 11px;
    color: var(--text-dim);
    white-space: nowrap;
  }
  .stats {
    display: flex;
    gap: 14px;
    margin-left: auto;
    flex-wrap: wrap;
  }
  .stat {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    line-height: 1.2;
  }
  .stat .n {
    font-size: 15px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .stat .l {
    font-size: 9.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
  }
  .stat.warn .n { color: var(--status-modularize); }
  .stat.risk .n { color: var(--status-risk); }

  main {
    flex: 1;
    display: grid;
    grid-template-columns: 220px 1fr 300px;
    min-height: 0;
  }

  .panel {
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 14px;
    font-size: 12.5px;
  }
  .panel + .panel { border-right: none; border-left: 1px solid var(--border); }

  .panel h2 {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--text-dim);
    margin: 0 0 8px;
  }
  .panel h2:not(:first-child) { margin-top: 18px; }

  .chip-row { display: flex; flex-direction: column; gap: 4px; }
  .chip {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 8px;
    border-radius: 6px;
    cursor: pointer;
    border: 1px solid transparent;
    user-select: none;
  }
  .chip:hover { background: var(--surface-2); }
  .chip.off { opacity: 0.4; }
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .chip .sq { width: 9px; height: 9px; flex: none; }
  .chip .count {
    margin-left: auto;
    font-size: 10.5px;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }

  input[type="search"] {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 6px 8px;
    font-size: 12.5px;
    outline: none;
  }
  input[type="search"]:focus { border-color: var(--focus); }

  .canvas-wrap {
    position: relative;
    background: var(--canvas-bg);
    overflow: hidden;
  }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  canvas:active { cursor: grabbing; }

  .hint {
    position: absolute;
    left: 12px;
    bottom: 10px;
    font-size: 10.5px;
    color: var(--text-dim);
    background: color-mix(in srgb, var(--surface) 82%, transparent);
    padding: 5px 9px;
    border-radius: 6px;
    border: 1px solid var(--border);
  }

  #detail {
    padding: 16px;
    font-size: 12.5px;
  }
  #detail .empty { color: var(--text-dim); font-size: 12px; }
  #detail .kind-badge {
    display: inline-block;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 2px 7px;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  #detail h3 {
    margin: 0 0 4px;
    font-size: 15px;
    line-height: 1.3;
    text-wrap: balance;
  }
  #detail .meta-row {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    padding: 5px 0;
    border-bottom: 1px solid var(--border);
  }
  #detail .meta-row .k { color: var(--text-dim); }
  #detail .meta-row .v { text-align: right; font-variant-numeric: tabular-nums; }
  #detail .reason {
    margin-top: 10px;
    padding: 10px;
    border-radius: 8px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    line-height: 1.5;
  }
  #detail .edges { margin-top: 12px; }
  #detail .edge-item {
    padding: 6px 8px;
    border-radius: 6px;
    background: var(--surface-2);
    margin-bottom: 4px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    gap: 6px;
  }
  #detail .edge-item:hover { background: var(--accent-soft); }
  #detail .edge-item .k { color: var(--text-dim); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.04em; }

  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; }
  }
</style>
</head>
<body>
  <header>
    <h1>Trancendos Platform Topology</h1>
    <span class="sub mono" id="generated-at"></span>
    <div class="stats" id="stats"></div>
  </header>

  <main>
    <div class="panel" id="left-panel">
      <h2>Search</h2>
      <input type="search" id="search" placeholder="Find a node…" />

      <h2>Layers</h2>
      <div class="chip-row" id="layer-toggles"></div>

      <h2>Status</h2>
      <div class="chip-row" id="status-toggles"></div>
    </div>

    <div class="canvas-wrap">
      <canvas id="graph"></canvas>
      <div class="hint">Drag to pan · scroll to zoom · drag a node to pin it · click for detail</div>
    </div>

    <div class="panel" id="detail">
      <div class="empty">Click any node to inspect it — location, service, router, or governance suite.</div>
    </div>
  </main>

<script type="application/json" id="graph-data">__TOPOLOGY_GRAPH_JSON__</script>
<script>
// Read from a non-executable script[type=application/json] block via
// .textContent + JSON.parse rather than interpolating the payload directly
// into a JS statement — graph data ultimately comes from repo content
// (compose service names, entity/router labels, YAML-sourced suite names),
// and the HTML parser ends a script element on a literal closing script
// tag substring regardless of JS syntax (comment, string, anything), which
// would otherwise terminate this block early no matter how the JSON was
// escaped. Note this comment is deliberately phrased to avoid containing
// that literal substring itself.
const GRAPH = JSON.parse(document.getElementById("graph-data").textContent);

// Graph field values (labels, reasons, metadata) come from repo content —
// compose service names, entity/router labels, YAML-sourced suite names —
// and get interpolated into innerHTML template strings below. None of that
// is expected to contain HTML today, but nothing enforces it, so escape on
// the way in rather than assume it.
function esc(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#39;");
}

const STATUS_META = {
  needs_modularization: { label: "Needs modularization", color: "var(--status-modularize)" },
  unreasoned_duplicate_risk: { label: "Unreasoned duplicate risk", color: "var(--status-risk)" },
  core_load_bearing: { label: "Core / load-bearing", color: "var(--status-core)" },
  no_worker_exists: { label: "No worker exists yet", color: "var(--status-safe)" },
  safe_duplicate_removed: { label: "Duplicate removed (history)", color: "var(--status-removed)" },
  unclassified: { label: "Mounted, unclassified", color: "var(--status-unclassified)" },
  stale_claim: { label: "Stale entity claim", color: "var(--status-stale)" },
};
const TYPE_META = {
  location: { label: "Locations", shape: "square", color: "var(--accent)" },
  lead_ai: { label: "Lead AIs", shape: "circle", color: "var(--accent)" },
  service: { label: "Deployed services", shape: "circle", color: "var(--status-safe)" },
  router: { label: "In-process routers", shape: "diamond", color: "var(--status-unclassified)" },
  matrix_suite: { label: "Matrix Suites", shape: "diamond", color: "var(--suite)" },
};

function resolveVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name.slice(4, -1)).trim();
}

// ---------- layout ----------
const W0 = 3400, H0 = 2200;
const BAND_X = { location: 0.1, lead_ai: 0.27, matrix_suite: 0.46, router: 0.63, service: 0.85 };
const typeCounts = {};
for (const n of GRAPH.nodes) typeCounts[n.type] = (typeCounts[n.type] || 0) + 1;
const typeIndex = {};
const nodes = GRAPH.nodes.map((n) => {
  const idx = (typeIndex[n.type] = (typeIndex[n.type] || 0) + 1);
  const total = typeCounts[n.type];
  const colX = BAND_X[n.type] ?? 0.5;
  return {
    ...n,
    x: colX * W0 + (Math.random() - 0.5) * 140,
    y: (idx / (total + 1)) * H0 + (Math.random() - 0.5) * 80,
    vx: 0,
    vy: 0,
    pinned: false,
    r: n.type === "location" || n.type === "matrix_suite" ? 7 : n.type === "service" ? 6 : 4.5,
  };
});
const nodeById = new Map(nodes.map((n) => [n.id, n]));
const edges = GRAPH.edges
  .map((e) => ({ ...e, s: nodeById.get(e.source), t: nodeById.get(e.target) }))
  .filter((e) => e.s && e.t);

// ---------- force simulation ----------
function step() {
  const REPULSE = 5200;
  for (let i = 0; i < nodes.length; i++) {
    const a = nodes[i];
    if (a.pinned) continue;
    let fx = 0, fy = 0;
    for (let j = 0; j < nodes.length; j++) {
      if (i === j) continue;
      const b = nodes[j];
      let dx = a.x - b.x, dy = a.y - b.y;
      let d2 = dx * dx + dy * dy || 0.01;
      if (d2 > 240000) continue;
      const f = REPULSE / d2;
      const d = Math.sqrt(d2);
      fx += (dx / d) * f;
      fy += (dy / d) * f;
    }
    a.fx = fx; a.fy = fy;
  }
  for (const e of edges) {
    const dx = e.t.x - e.s.x, dy = e.t.y - e.s.y;
    const d = Math.sqrt(dx * dx + dy * dy) || 0.01;
    const k = 0.012;
    const fx = dx * k, fy = dy * k;
    if (!e.s.pinned) { e.s.fx += fx; e.s.fy += fy; }
    if (!e.t.pinned) { e.t.fx -= fx; e.t.fy -= fy; }
  }
  const bandX = BAND_X;
  for (const n of nodes) {
    if (n.pinned) continue;
    const targetX = (bandX[n.type] ?? 0.5) * W0;
    n.fx += (targetX - n.x) * 0.02;
    n.fy += (H0 / 2 - n.y) * 0.0015;
    n.vx = (n.vx + n.fx * 0.02) * 0.82;
    n.vy = (n.vy + n.fy * 0.02) * 0.82;
    n.x += n.vx;
    n.y += n.vy;
  }
}
for (let i = 0; i < 260; i++) step();

// ---------- rendering ----------
const canvas = document.getElementById("graph");
const ctx = canvas.getContext("2d");
let viewX = 0, viewY = 0, zoom = 1;

function fitView() {
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * devicePixelRatio;
  canvas.height = rect.height * devicePixelRatio;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const n of nodes) {
    minX = Math.min(minX, n.x); maxX = Math.max(maxX, n.x);
    minY = Math.min(minY, n.y); maxY = Math.max(maxY, n.y);
  }
  const pad = 80;
  const gw = maxX - minX + pad * 2, gh = maxY - minY + pad * 2;
  zoom = Math.min(rect.width / gw, rect.height / gh, 1.1);
  viewX = minX - pad;
  viewY = minY - pad;
}

const active = { layers: new Set(Object.keys(TYPE_META)), statuses: new Set(Object.keys(STATUS_META)) };
let selected = null;
let hovered = null;
let query = "";

function nodeVisible(n) {
  if (!active.layers.has(n.type)) return false;
  if (n.classification && !active.statuses.has(n.classification)) return false;
  return true;
}
function nodeColor(n) {
  if (n.classification && STATUS_META[n.classification]) return resolveVar(STATUS_META[n.classification].color);
  return resolveVar(TYPE_META[n.type].color);
}
function matchesQuery(n) {
  if (!query) return false;
  return n.label.toLowerCase().includes(query);
}

function draw() {
  const rect = canvas.getBoundingClientRect();
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  ctx.clearRect(0, 0, rect.width, rect.height);
  ctx.save();
  ctx.translate(-viewX * zoom, -viewY * zoom);
  ctx.scale(zoom, zoom);

  const borderColor = resolveVar("var(--border)");
  const textDim = resolveVar("var(--text-dim)");
  const accent = resolveVar("var(--accent)");

  // edges
  for (const e of edges) {
    if (!nodeVisible(e.s) || !nodeVisible(e.t)) continue;
    const highlight = selected && (e.s.id === selected.id || e.t.id === selected.id);
    ctx.beginPath();
    ctx.moveTo(e.s.x, e.s.y);
    ctx.lineTo(e.t.x, e.t.y);
    if (e.kind === "removed" || e.kind === "stale_claim") ctx.setLineDash([4, 3]);
    else ctx.setLineDash([]);
    ctx.strokeStyle = highlight ? accent : e.kind === "stale_claim" ? resolveVar("var(--status-stale)") : borderColor;
    ctx.lineWidth = (highlight ? 1.6 : 0.8) / zoom;
    ctx.globalAlpha = highlight ? 0.9 : 0.45;
    ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.globalAlpha = 1;

  // nodes
  for (const n of nodes) {
    if (!nodeVisible(n)) continue;
    const isSel = selected && selected.id === n.id;
    const isHover = hovered && hovered.id === n.id;
    const isMatch = matchesQuery(n);
    const dim = query && !isMatch;
    ctx.globalAlpha = dim ? 0.18 : 1;

    const color = nodeColor(n);
    const shape = TYPE_META[n.type].shape;
    const r = n.r * (isSel || isHover ? 1.5 : 1);

    ctx.beginPath();
    if (shape === "circle") {
      ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
    } else if (shape === "square") {
      ctx.rect(n.x - r, n.y - r, r * 2, r * 2);
    } else {
      ctx.moveTo(n.x, n.y - r); ctx.lineTo(n.x + r, n.y); ctx.lineTo(n.x, n.y + r); ctx.lineTo(n.x - r, n.y);
      ctx.closePath();
    }
    ctx.fillStyle = color;
    ctx.fill();
    if (isSel || isMatch) {
      ctx.lineWidth = 2 / zoom;
      ctx.strokeStyle = accent;
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    const alwaysLabeled = n.type === "location" || n.type === "matrix_suite";
    const labelZoom = alwaysLabeled ? 0.32 : 0.85;
    if ((zoom > labelZoom || isSel || isHover || isMatch) && !dim) {
      ctx.font = `${isSel ? 12 : 10}px -apple-system, sans-serif`;
      ctx.fillStyle = textDim;
      ctx.fillText(n.label, n.x + r + 4, n.y + 3);
    }
  }
  ctx.restore();
}

function loop() { draw(); requestAnimationFrame(loop); }

// ---------- interaction ----------
let dragNode = null, panning = false, panStart = null, dragged = false;

function toWorld(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (clientX - rect.left) / zoom + viewX,
    y: (clientY - rect.top) / zoom + viewY,
  };
}
function hitTest(pt) {
  let best = null, bestD = 14 / zoom;
  for (const n of nodes) {
    if (!nodeVisible(n)) continue;
    const d = Math.hypot(n.x - pt.x, n.y - pt.y);
    if (d < bestD) { bestD = d; best = n; }
  }
  return best;
}

canvas.addEventListener("pointerdown", (e) => {
  const pt = toWorld(e.clientX, e.clientY);
  const hit = hitTest(pt);
  dragged = false;
  if (hit) { dragNode = hit; hit.pinned = true; }
  else { panning = true; panStart = { x: e.clientX, y: e.clientY, vx: viewX, vy: viewY }; }
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove", (e) => {
  dragged = true;
  if (dragNode) {
    const pt = toWorld(e.clientX, e.clientY);
    dragNode.x = pt.x; dragNode.y = pt.y; dragNode.vx = 0; dragNode.vy = 0;
  } else if (panning) {
    viewX = panStart.vx - (e.clientX - panStart.x) / zoom;
    viewY = panStart.vy - (e.clientY - panStart.y) / zoom;
  } else {
    const pt = toWorld(e.clientX, e.clientY);
    hovered = hitTest(pt);
    canvas.style.cursor = hovered ? "pointer" : "grab";
  }
});
canvas.addEventListener("pointerup", (e) => {
  if (dragNode && !dragged) selectNode(dragNode);
  else if (!dragNode && !panning) { /* noop */ }
  else if (panning && !dragged) selectNode(null);
  dragNode = null; panning = false;
  canvas.releasePointerCapture(e.pointerId);
});
canvas.addEventListener("click", (e) => {
  if (dragged) return;
  const pt = toWorld(e.clientX, e.clientY);
  selectNode(hitTest(pt));
});
canvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  const pt = toWorld(e.clientX, e.clientY);
  const factor = e.deltaY > 0 ? 0.9 : 1.1;
  zoom = Math.min(4, Math.max(0.15, zoom * factor));
  const pt2 = toWorld(e.clientX, e.clientY);
  viewX += pt.x - pt2.x;
  viewY += pt.y - pt2.y;
}, { passive: false });

document.getElementById("search").addEventListener("input", (e) => {
  query = e.target.value.trim().toLowerCase();
});

// ---------- detail panel ----------
function edgesFor(n) {
  return edges.filter((e) => e.s.id === n.id || e.t.id === n.id);
}
function selectNode(n) {
  selected = n;
  const el = document.getElementById("detail");
  if (!n) {
    el.innerHTML = '<div class="empty">Click any node to inspect it — location, service, router, or governance suite.</div>';
    return;
  }
  const badge = TYPE_META[n.type]?.label ?? n.type;
  const status = n.classification ? STATUS_META[n.classification] : null;
  let meta = "";
  const metaFields = {
    port: "Port", pillar: "Pillar", primary_function: "Function", pid: "PID", aid: "AID",
    claimed_worker_port: "Claimed port", claimed_worker_path: "Claimed path",
    steward_ai: "Steward AI", steward_location: "Steward location",
    matrix_count: "Matrices", review_cadence: "Cadence", next_review: "Next review",
    mounted: "Mounted", deployed: "Deployed",
  };
  for (const [k, label] of Object.entries(metaFields)) {
    if (n[k] === undefined || n[k] === null || n[k] === "") continue;
    meta += `<div class="meta-row"><span class="k">${esc(label)}</span><span class="v mono">${esc(n[k])}</span></div>`;
  }
  const reason = n.reason
    ? `<div class="reason">${esc(n.reason)}</div>`
    : "";
  const rel = edgesFor(n)
    .map((e) => {
      const other = e.s.id === n.id ? e.t : e.s;
      return `<div class="edge-item" data-id="${esc(other.id)}"><span>${esc(other.label)}</span><span class="k">${esc(e.kind)}</span></div>`;
    })
    .join("");

  el.innerHTML = `
    <span class="kind-badge">${esc(badge)}${status ? " · " + esc(status.label) : ""}</span>
    <h3>${esc(n.label)}</h3>
    ${meta}
    ${reason}
    ${rel ? `<div class="edges"><h2 style="margin-top:14px">Connections (${edgesFor(n).length})</h2>${rel}</div>` : ""}
  `;
  el.querySelectorAll(".edge-item").forEach((row) => {
    row.addEventListener("click", () => selectNode(nodeById.get(row.dataset.id)));
  });
}

// ---------- side panels ----------
function renderToggles(containerId, meta, activeSet, shapeKind) {
  const container = document.getElementById(containerId);
  const counts = {};
  for (const n of nodes) {
    const key = shapeKind === "layer" ? n.type : n.classification;
    if (key) counts[key] = (counts[key] || 0) + 1;
  }
  container.innerHTML = "";
  for (const [key, m] of Object.entries(meta)) {
    const chip = document.createElement("div");
    chip.className = "chip";
    const shapeEl = shapeKind === "layer" && m.shape === "square" ? "sq" : "dot";
    chip.innerHTML = `<span class="${shapeEl}" style="background:${m.color}"></span><span>${m.label}</span><span class="count mono">${counts[key] || 0}</span>`;
    chip.addEventListener("click", () => {
      if (activeSet.has(key)) { activeSet.delete(key); chip.classList.add("off"); }
      else { activeSet.add(key); chip.classList.remove("off"); }
    });
    container.appendChild(chip);
  }
}
renderToggles("layer-toggles", TYPE_META, active.layers, "layer");
renderToggles("status-toggles", STATUS_META, active.statuses, "status");

// ---------- header stats ----------
function renderStats() {
  const s = GRAPH.summary;
  document.getElementById("generated-at").textContent = "generated " + s.generated_at.replace("T", " ").slice(0, 16) + " UTC";
  const items = [
    { n: s.total_nodes, l: "Nodes" },
    { n: s.deployed_services, l: "Services" },
    { n: s.locations, l: "Locations" },
    { n: s.matrix_suites, l: "Suites" },
    { n: s.needs_modularization, l: "Needs work", cls: "warn" },
    { n: s.unreasoned_duplicate_risk, l: "Unreasoned risk", cls: "risk" },
    { n: s.stale_claims, l: "Stale claims", cls: "risk" },
  ];
  document.getElementById("stats").innerHTML = items
    .map((i) => `<div class="stat ${i.cls || ""}"><span class="n mono">${i.n}</span><span class="l">${i.l}</span></div>`)
    .join("");
}

renderStats();
fitView();
window.addEventListener("resize", () => { fitView(); });
loop();
</script>
