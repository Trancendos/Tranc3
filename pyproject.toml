[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "tranc3"
version = "0.8.0"
requires-python = ">=3.11"
description = "Trancendos AI Platform — Luminous inference engine + MCP server"

# ── Ruff (lint + format) ──────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    ".forgejo",
    "docs/reference",
    "**/*.sh",
    # Git submodules — separate repositories with their own lint configuration and
    # their own CI. Without these, `ruff check .` reports a different error count
    # depending on whether submodules happen to be checked out (26 vs 46), and
    # `--fix` writes into another repository's working tree.
    "compliance/magna-carta",
    "workers/cranbania",
]

[tool.ruff.lint]
select = ["E", "F", "W", "C", "B", "I"]
ignore = [
  "E501",   # line length — enforced by formatter, not lint
  "B008",   # function calls in default args (FastAPI Depends pattern)
  # C901 complexity. NOT "warned, not blocked" as this line said until
  # 2026-09-10 — an `ignore` entry means ruff never runs the rule, so nothing
  # warned anywhere. 183 functions exceed the default threshold of 10 and no
  # control in the estate reported one of them; CodeFactor's public page was
  # flagging seven that this repository could not see.
  #
  # It stays ignored HERE, because 183 lint errors on every pull request is a
  # gate people bypass rather than satisfy. It is now measured instead, by the
  # `complexity` sensor in config/immune/sensors.yaml, at a threshold of 20 —
  # reported, baselined so it cannot grow, and ranked by churn. See
  # docs/governance/IMMUNE-SYSTEM.md.
  "C901",
]

[tool.ruff.lint.per-file-ignores]
"tests/*"  = ["S", "B", "C408", "C416"]
"scripts/*" = ["T201"]   # print() allowed in scripts
"api.py"   = ["E402", "B904"]
"api_ecosystem.py" = ["E402", "B904"]  # middleware imports must come after app creation
"api_enhanced.py" = ["E402", "B904"]   # middleware imports must come after app creation
"migrations/*" = ["E402"]
"train.py" = ["E402"]
"tranc3-bots/*" = ["E402", "E702"]
"src/neural/attention_router.py" = ["C416"]
# Nanoservices: re-export __init__ files and research/simulation modules
"src/nanoservices/**/__init__.py" = ["F401"]
"src/nanoservices/**" = ["B007", "B905", "E741", "E712", "W291", "W293"]
"shared_core/__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── mypy ──────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
no_error_summary = true
show_error_codes = true
warn_unused_ignores = false

# ── pytest ────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
log_cli = false
log_level = "WARNING"
addopts = "--strict-markers -q"
markers = [
  "slow: marks tests as slow (deselect with -m 'not slow')",
  "integration: requires live external services",
  "chaos: fault injection tests",
]

# ── bandit ─────────────────────────────────────────────────────────────
[tool.bandit]
targets = ["src", "api.py"]
exclude_dirs = ["tests", "scripts", "src/nanoservices/genetic_optimizer", "src/evolution"]
severity = "low"
confidence = "low"
skips = [
  # B101: assert statements — acceptable in non-production paths
  "B101",
  # B110: try/except/pass — intentional silent fallback in distributed service workers
  #   with 5-tier fallback chains; each tier logs before swallowing; not unhandled.
  "B110",
  # B311: pseudo-random generators — all cryptographic uses now use secrets module
  #   (mpc_service.py, zkp_service.py). Remaining uses are non-cryptographic:
  #   ML algorithm weights, genetic optimizer crossover/mutation, circuit-breaker
  #   probabilistic gating, simulation noise. None used for key/token generation.
  "B311",
  # B310: urllib URL opening.
  #
  #   The justification here read "all URLs are internal service-mesh endpoints
  #   resolved from validated config" until 2026-09-11. That was false for at
  #   least one call site, and CodeFactor was the only thing saying so:
  #   `scripts/check_trivyignore_governance.py` queries the PUBLIC OSV API at
  #   `https://api.osv.dev/`, which is neither internal nor service-mesh. The
  #   code there is safe — a constant prefix, `SAFE_ID.fullmatch` on the only
  #   variable segment, and a re-check that the assembled URL still starts with
  #   the prefix — but a suppression that is right by accident is a suppression
  #   nobody can check.
  #
  #   The replacement said "every urlopen in this estate", which was also
  #   wrong, in the same direction, and four reviewers caught it on PR #1207.
  #   Re-measured, because that count was wrong too: `scripts/` holds 16
  #   urlopen CALL sites across 15 files (`grep -c 'urlopen('` summed over
  #   `scripts/*.py`), plus one more inside the embedded Python in
  #   `scripts/stack-up.sh`. The earlier figure of 19 counted import lines as
  #   call sites. Several of the real ones
  #   (deploy_cloud._http_ok, cloud_smoke_check._request, wait_for_healthy,
  #   health_check, n1_checker) take a URL as a parameter. A justification is
  #   not improved by widening the claim it makes.
  #
  #   The scoped rewrite that followed said no in-scope call site lets a caller
  #   choose the scheme. cubic checked, and that was wrong too: `vllm.py`,
  #   `llamacpp.py`, `zero_cost_config.py`'s two probes and `roadmap_generator.py`
  #   all built their URL from an env var with no scheme check, and `urlopen`'s
  #   default opener carries a FileHandler -- so `file:///etc/passwd` was a
  #   successful request returning file contents. `wazuh_connector.py` was a sixth,
  #   found while fixing those. All six now validate through the shared
  #   `src/utils/url_guard.py`. The five call sites that already had the check
  #   (`layer_rotator`, `meilisearch_client`, `web_scraper`, `misp_connector`,
  #   `security_checks`) keep their inline versions -- they were correct, and
  #   `meilisearch_client`'s additionally reconstructs the URL to break CodeQL's
  #   taint chain, which the shared helper deliberately does not do. So this is one
  #   definition for new code, not a completed consolidation of the old.
  #
  #   Three wrong justifications in a row is not a wording problem. A claim written
  #   in a comment has nothing checking it, so it decays while the code moves. The
  #   claim therefore now lives in `tests/test_url_scheme_guard.py`, which enforces
  #   what this paragraph would otherwise only assert:
  #
  #     * every urlopen in bandit's scanned scope (`src`, `api.py`) carries an
  #       explicit B310 suppression -- the blanket skip hides them either way, and
  #       the marker is what makes them findable;
  #     * every suppression states a reason;
  #     * every reason is one of exactly two shapes, verified against the code --
  #       "scheme validated" requires a real scheme check or a `url_guard` import
  #       in that file, and "hardcoded https" requires a literal https:// value
  #       visible from that call's own scope chain.
  #
  #   A new in-scope call site that is neither shape fails that test. Read it
  #   rather than this comment if the two ever disagree.
  #
  #   Call sites OUTSIDE that scope are not covered by this skip because bandit
  #   never reaches them: `scripts/` is in `exclude_dirs`, so B310 does not run
  #   there at all, skip or no skip. Several of those files carry their own
  #   `# nosec B310` / `# noqa: S310` with a local reason, which is the right
  #   shape; the rest are unscanned. That coverage gap is real and is tracked
  #   separately -- it is not something this skip grants or withholds.
  "B310",
  # B108: probable insecure temp file usage — all workers run in isolated Docker
  #   containers with no shared /tmp between services; attack surface is contained.
  "B108",
  # B105/B106/B107: hardcoded password/filename — flagged strings are config keys,
  #   env-var names, or fixture identifiers, not actual credentials in production.
  "B105",
  "B106",
  "B107",
]

# ── semgrep ────────────────────────────────────────────────────────────────
[tool.semgrep]
config = "auto"

# ── safety ─────────────────────────────────────────────────────────────────
[tool.safety]
ignore = [
  { id = "PYSEC-2025-210", reason = "Profiler not used in Tranc3" },
  { id = "PYSEC-2025-194", reason = "TorchScript JIT not used in Tranc3" },
  { id = "PYSEC-2025-196", reason = "Flatbuffer loading not used in Tranc3" },
  { id = "PYSEC-2025-195", reason = "Local-only; mitigated by input sanitization" },
  { id = "PYSEC-2025-193", reason = "Local-only; mitigated by input sanitization" },
  { id = "PYSEC-2025-192", reason = "Local-only; mitigated by input sanitization" },
  { id = "PYSEC-2026-139", reason = "Mitigated by weights_only=True on all torch.load()" },
  { id = "PYSEC-2025-191", reason = "Disputed; mkldnn not used in Tranc3" },
  { id = "PYSEC-2025-197", reason = "Local-only; no direct CUDA allocator interaction" },
  { id = "PYSEC-2025-189", reason = "Remote-capable but high complexity; profiler not used" },
  { id = "PYSEC-2025-190", reason = "Local-only; quantized sigmoid not used in Tranc3" },
]

# ── coverage ──────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "scripts/*", "*/migrations/*"]

[tool.coverage.report]
fail_under = 40
show_missing = true

# ── pip-audit ─────────────────────────────────────────────────────────
[tool.pip-audit]
strict = false
desc = true

# ── uv (drop-in pip replacement, zero-cost) ───────────────────────────
# uv is used for faster dependency resolution in CI.
# Install: curl -LsSf https://astral.sh/uv/install.sh | sh
[tool.uv]
dev-dependencies = [
  "pip-audit",
  "bandit[toml]",
  "ruff",
  "mypy",
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "checkov",
  "semgrep",
  "cyclonedx-bom",
]

# ── checkov (IaC + Docker Compose security) ───────────────────────────
[tool.checkov]
# Frameworks to scan (dockerfile, docker-compose)
framework = ["dockerfile", "docker-compose"]
# Suppress known-acceptable findings
skip-check = [
  # Allow EXPOSE of high ports in dev Dockerfiles (self-hosted, no DMZ)
  "CKV_DOCKER_7",
  # Allow ADD (used for COPY+extract patterns in some workers)
  "CKV_DOCKER_4",
]
soft-fail = true
output = ["json"]

# ── osv-scanner ───────────────────────────────────────────────────────
# Config file: .osv-scanner.toml (false-positive suppression)
# Run: osv-scanner --recursive --config .osv-scanner.toml .
