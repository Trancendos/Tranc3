[package]
name = "aeonmind-core"
version = "0.1.0"
edition = "2021"
description = "AeonMind core — Liquid State, Genetic DNA, Quantum Decision, Adaptive Meta-Learning for Tranc3 Infinity Ecosystem"
license = "MIT"
repository = "https://github.com/Trancendos/Tranc3"

[lib]
name = "aeonmind_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"], optional = true }
ndarray = "0.17"
ndarray-rand = "0.16"
rand = "0.9"
num-complex = "0.4"
serde = { version = "1", features = ["derive"] }
rayon = "1.10"
thiserror = "2"
tracing = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# rand 0.9 pulls getrandom 0.3, which ships NO backend for
# wasm32-unknown-unknown unless one is named. Without this the crate does not
# compile for that target at all -- measured, rc=101. (main did not compile for
# it either: getrandom 0.2 needed its `js` feature, equally absent. The gap is
# older than the bump; only the mechanism for closing it changed.) The matching
# `--cfg getrandom_backend="wasm_js"` lives in .cargo/config.toml, scoped to
# this target so host builds are untouched.
getrandom = { version = "0.3", features = ["wasm_js"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["console"] }
serde-wasm-bindgen = "0.6"

[features]
default = ["python"]
python = ["pyo3"]
wasm = []
full = ["python", "wasm"]

[dev-dependencies]
criterion = { version = "=0.8.2", features = ["html_reports"] }

[[bench]]
name = "liquid_reservoir"
harness = false

[[bench]]
name = "quantum_circuit"
harness = false
