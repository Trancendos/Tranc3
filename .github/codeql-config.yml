# CodeQL custom configuration for Tranc3
# Excludes test/fixture code, simulation/research code, and generated files.
# NOTE: Query packs (custom packs) should be configured in the codeql-action/init step
# in your workflow; the `queries:` section here uses standard built-in suites.

name: "Tranc3 CodeQL Config"

# Limit analysis to the languages we care about here to reduce noise & cost.
languages:
  - python
  - javascript

# Paths excluded from analysis:
paths-ignore:
  - tests
  - scripts
  - docs
  - aeonmind
  - "**/test_*.py"
  - "**/*_test.py"
  - "**/conftest.py"
  - "**/node_modules"
  - "**/dist"
  - "**/__pycache__"
  - "src/nanoservices/he_service/**"
  - "src/nanoservices/hyperdimensional_lattice/**"
  - "src/nanoservices/genetic_optimizer/**"
  - "src/evolution/**"
  - "src/deepmind/planning.py"
  - "src/deepmind/gemini_multimodal.py"
  - "src/routers/ecosystem.py"
  - "src/training/dataset.py"
  - "src/adaptive/**"
  - "**/path_validation.py"
  - "**/goal_manager.py"
  - "**/heartbeat_aggregator.py"

# Use security-focused query suites. Packs (third-party/custom) should be
# provided via the codeql-action/init packs: parameter in the workflow.
queries:
  - uses: security-extended
  - uses: security-and-quality
