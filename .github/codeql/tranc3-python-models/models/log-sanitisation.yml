# The estate's own log sanitiser, declared so CodeQL can see it.
#
# `Dimensional.sanitize.sanitize_for_log` strips control characters, replaces
# newlines and carriage returns, and truncates — which is exactly the barrier
# CodeQL's py/log-injection query is looking for. Without this model the query
# cannot tell a sanitised log call from an unsanitised one, so all 90 call
# sites across src/, workers/ and api.py were reported the same way. That made
# the alert list uninformative in both directions: correct code was flagged,
# and a genuinely unsanitised call had nothing to stand out against.
#
# Same shape and reasoning as the path-validation and url-validation models in
# this pack. `shared_core.sanitize` is a re-export shim over
# `Dimensional.sanitize`, and is listed for the same reason the other two
# models list both namespaces — call sites exist under each.
extensions:
  - addsTo:
      pack: codeql/python-all
      extensible: barrierModel
    data:
      - ["Dimensional", "Member[sanitize].Member[sanitize_for_log].ReturnValue", "log-injection"]
      - ["Dimensional", "Member[sanitize].Member[sanitize_dict_for_log].ReturnValue", "log-injection"]
      - ["shared_core", "Member[sanitize].Member[sanitize_for_log].ReturnValue", "log-injection"]
      - ["shared_core", "Member[sanitize].Member[sanitize_dict_for_log].ReturnValue", "log-injection"]
