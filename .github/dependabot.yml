# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

# Why grouping exists here (added 2026-08-21):
#
# This file declared twelve ecosystem entries, each with a five-PR limit and no
# `groups:` key at all. Ungrouped, Dependabot opens one pull request per
# dependency, so the estate accumulated 98 simultaneously-open dependency PRs --
# a queue nobody could review, which meant none of them were reviewed. The
# backlog was not a discipline failure; it was this configuration working as
# written.
#
# Grouping collapses the safe majority into one PR per ecosystem per directory.
# Majors stay ungrouped on purpose: a Python 3.11 -> 3.14 or Next 15 -> 16 bump
# deserves to be looked at on its own, and burying it in a group of forty patch
# bumps is how a runtime change gets merged by accident.

#
# Why every limit below is 0 (added 2026-10-05):
#
# Grouping fixed the volume and left the duplication. Renovate (`renovate.json`)
# sets no `enabledManagers`, so it covers every manager -- pip, npm, dockerfile,
# docker-compose, github-actions, gomod -- and this file covers pip, npm, docker
# and github-actions. Two bots proposed the same upgrades and edited the same
# manifest lines, so their pull requests conflicted with each other by
# construction. Measured in the open queue on 2026-10-05: vite sat at THREE
# versions at once (#985 7.3.5->8.2.2, #1361 8.3.1->8.3.2, and Renovate's
# "Node.js patch updates" group), and GitHub Actions arrived both as individual
# Dependabot PRs (#1365, #1208, #1205) and as one grouped Renovate PR (#1010).
#
# That is why the count kept climbing while pull requests were being merged:
# two generators were feeding one queue.
#
# `open-pull-requests-limit: 0` turns off Dependabot VERSION updates while
# leaving Dependabot SECURITY updates untouched -- those come from GitHub's
# advisory database, need no entry here, and are the reason this file stays
# rather than being deleted (#1148 is one, a grpc advisory in `/aeonmind/go`,
# a directory this file never declared). So the estate keeps two independent
# vulnerability sources, GitHub Advisory and OSV via Renovate, and gains one
# owner for routine upgrades.
#
# Renovate owns routine upgrades because its config carries the grouping, the
# 7-day supply-chain cooldown and the written reason for exempting published
# CVE fixes from it. Reverting is one value per ecosystem.

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    groups:
      # Patch and minor bumps travel together: they are the high-volume, low-risk
      # majority, and one reviewed PR per ecosystem is worth more than thirty
      # unreviewed ones. Majors are deliberately NOT grouped -- anything that can
      # change an interpreter, a framework or a runtime still gets its own PR and
      # its own decision.
      safe-updates:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
    ignore:
      # The five framework pins governed centrally by
      # scripts/align_framework_pins.py are held here. They are restated in 63
      # requirements files, so a single version decision arrives as 63 identical
      # line changes; that script applies all of them in one reviewed pass, and
      # its CANONICAL dict is the one place the decision is made.
      #
      # Without this, every bump of one of these packages produces a PR that
      # CANNOT pass CI: the `Framework pin check` in ci.yml fails any tree whose
      # pins disagree with CANONICAL, so a bot PR that moves some files and not
      # the script is unmergeable by construction. Three such PRs (#1139, #1140,
      # #1141) were open on 2026-09-03 for exactly this reason, and Renovate's
      # #1054 proposed the same pydantic bump across all 63 files with automerge
      # enabled — the pin gate was the only thing holding it.
      #
      # To bump one of these: edit CANONICAL in that script and run it with
      # --write. Not here.
      - dependency-name: "fastapi"
      - dependency-name: "starlette"
      - dependency-name: "pydantic"
      - dependency-name: "uvicorn"
      - dependency-name: "redis"
      # ML libraries whose majors renovate.json blocks: "Block ML library
      # upgrades -- require manual compatibility testing." Dependabot does not
      # read renovate.json, so without this the policy holds on one path and
      # not the other. Minor and patch still arrive; only major is held.
      - dependency-name: "torch"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "transformers"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "sentence-transformers"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "pip"
    directory: "/tranc3-bots"
    schedule:
      interval: "monthly"
