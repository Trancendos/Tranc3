          - "minor"
          - "patch"
    ignore:
      # The React-ecosystem majors renovate.json already blocks. Both bots
      # propose into this same directory, and dependabot does not read
      # renovate.json, so the policy merged in #1242 covered one path and left
      # the other open -- #1203 ("Bump react, react-dom and @types/react in
      # /web") is that gap arriving as a pull request.
      #
      # The reason is unchanged: these are peer-coupled to the React version
      # web/ actually runs, and a bot cannot see that. #1119 merged
      # react-router v8 into a React 18.3.1 app; v8 peers on react >=19.2.7, so
      # `npm ci` could not resolve and Frontend Build & Deploy went red on main
      # -- a deploy that stops, not a test that fails. Raising these means
      # migrating React first, which is a decision rather than an update.
      #
      # Minor and patch updates still arrive; only major is held.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-router"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-router-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    groups:
