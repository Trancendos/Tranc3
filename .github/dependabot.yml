# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

# Why grouping exists here (added 2026-08-21):
#
# This file declared twelve ecosystem entries, each with a five-PR limit and no
# `groups:` key at all. Ungrouped, Dependabot opens one pull request per
# dependency, so the estate accumulated 98 simultaneously-open dependency PRs --
# a queue nobody could review, which meant none of them were reviewed. The
# backlog was not a discipline failure; it was this configuration working as
# written.
#
# Grouping collapses the safe majority into one PR per ecosystem per directory.
# Majors stay ungrouped on purpose: a Python 3.11 -> 3.14 or Next 15 -> 16 bump
# deserves to be looked at on its own, and burying it in a group of forty patch
# bumps is how a runtime change gets merged by accident.

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      # Patch and minor bumps travel together: they are the high-volume, low-risk
      # majority, and one reviewed PR per ecosystem is worth more than thirty
      # unreviewed ones. Majors are deliberately NOT grouped -- anything that can
      # change an interpreter, a framework or a runtime still gets its own PR and
      # its own decision.
      safe-updates:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"

