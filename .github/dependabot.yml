  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      # Patch and minor bumps travel together: they are the high-volume, low-risk
      # majority, and one reviewed PR per ecosystem is worth more than thirty
