  # There is no docker block for /workers or /deploy, and their absence is a
  # decision rather than an oversight. Both existed and neither had ever found
  # anything: dependabot's docker ecosystem does NOT search below the directory
  # it is given, /workers holds its 90 Dockerfiles one level down in
  # workers/<name>/Dockerfile, and /deploy has no Dockerfile at all. Every run
  # ended in `dependency_file_not_found: No Dockerfiles nor Kubernetes YAML
  # found`. Nobody saw it, because a config change is what makes dependabot
  # re-evaluate every block, and until #1250 touched this file none had.
  #
  # They were removed rather than repaired because renovate.json already covers
  # both paths -- it sets no `enabledManagers`, so its `dockerfile` and
  # `docker-compose` managers are live, and its `ignorePaths` excludes neither
  # directory. Repairing /workers would have added a second bot proposing
  # against 90 Dockerfiles on top of an already 36-deep bot queue, to duplicate
  # a route that works.
  #
  # The four docker blocks that remain each have a Dockerfile directly in their
  # directory. tests/test_dependency_policy_parity.py now asserts that, and it
  # is asserted for docker only: pip is measurably different. On the same
  # commit, `pip in /workers` succeeded while `docker in /workers` failed, from
  # the same directory with no direct manifest -- pip recurses, docker does not.

  - package-ecosystem: "github-actions"
