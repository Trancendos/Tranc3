# .github/workflows/perf-smoke.yml
#
# GitHub-hosted twin of .forgejo/workflows/perf-smoke.yml. Kept side by side
# deliberately, not as a migration — see that file's header for the full
# design rationale (non-blocking first step, no historical baseline yet).
# This one needs no secrets and no internal network: it starts the API
# server inside the job itself and load-tests localhost, so it can run on
# GitHub's own runners today with zero setup.

name: Perf Smoke Test

on:
  pull_request:
    branches: ["main", "develop"]
    paths:
      - 'api.py'
      - 'src/**'
      - 'scripts/loadtest/**'
      - '.github/workflows/perf-smoke.yml'
  schedule:
    - cron: '0 7 * * *'  # Daily 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  perf-smoke:
    name: k6 smoke load test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # v4

      - uses: actions/setup-python@v5 # v6
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Install k6
        run: |
          if ! command -v k6 &>/dev/null; then
            curl -sSfL https://github.com/grafana/k6/releases/download/v0.54.0/k6-v0.54.0-linux-amd64.tar.gz \
              | tar -xz --strip-components 1 -C /usr/local/bin k6-v0.54.0-linux-amd64/k6
          fi
          k6 version

      - name: Start API server
        run: |
          nohup uvicorn api:app --host 0.0.0.0 --port 8000 \
            > api-server.log 2>&1 &
          ready=0
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then
              ready=1; break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat api-server.log || true; exit 1; fi
        env:
          # api.py fails fast (unconditionally, not just in production) if any
          # of these four are unset — matches ci.yml's Pytest job convention.
          # SQLite/plain-redis-URL are enough to satisfy the presence check;
          # neither is actually connected to at import time.
          SECRET_KEY: ci-test-secret-not-for-prod
          JWT_SECRET: ci-test-jwt-secret-not-for-prod
          DATABASE_URL: sqlite:///./test.db
          REDIS_URL: redis://localhost:6379/0

      - name: Run k6 smoke load test
        run: k6 run scripts/loadtest/smoke.js || true
        env:
          BASE_URL: http://localhost:8000
