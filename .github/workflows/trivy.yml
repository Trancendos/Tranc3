name: "Trivy Security Scan"

concurrency:
  group: trivy-scan-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 7 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

env:
  TRIVY_SEVERITY: "HIGH,CRITICAL"
  TRIVY_OUTPUT_FORMAT: "sarif"

jobs:
  prepare-cache:
    name: Prepare Trivy cache
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache.outputs.cache-hit }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Trivy DB
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-v1
          restore-keys: |
            trivy-db-${{ runner.os }}-

  trivy-config:
    name: Trivy Misconfiguration Scan
    runs-on: ubuntu-latest
    needs: prepare-cache
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "config"
          scan-ref: "."
          format: ${{ env.TRIVY_OUTPUT_FORMAT }}
          output: "trivy-config.sarif"
          severity: ${{ env.TRIVY_SEVERITY }}
          exit-code: "0"
          trivyignores: ".trivyignore"

      - name: Upload Trivy config SARIF to Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-config.sarif"
          category: "trivy-config"

      - name: Upload Trivy config SARIF artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-config-sarif
          path: trivy-config.sarif

  trivy-fs:
    name: Trivy Filesystem Vulnerability Scan
    runs-on: ubuntu-latest
    needs: prepare-cache
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: ${{ env.TRIVY_OUTPUT_FORMAT }}
          output: "trivy-fs.sarif"
          severity: ${{ env.TRIVY_SEVERITY }}
          exit-code: "0"
          trivyignores: ".trivyignore"

      - name: Upload Trivy fs SARIF to Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-fs.sarif"
          category: "trivy-fs"

      - name: Upload Trivy fs SARIF artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-fs-sarif
          path: trivy-fs.sarif

  build-and-scan-image:
    name: Build container and Trivy Image Scan
    runs-on: ubuntu-latest
    needs: prepare-cache
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # `load: true` is what makes this job a scan rather than a build.
      # setup-buildx-action installs the `docker-container` driver, whose
      # output stays in the builder's own cache; with `push: false` and no
      # `load`, nothing is ever written to the local docker daemon. Trivy then
      # failed to find `tranc3:<sha>` locally, fell through to its `remote`
      # resolver, and asked docker.io for `library/tranc3` -- which answered
      # UNAUTHORIZED. The image scan had never scanned an image.
      - name: Build Docker image
        id: build
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          load: true
          tags: tranc3:${{ github.sha }}

      - name: Run Trivy image scan (local image)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "image"
          image-ref: "tranc3:${{ github.sha }}"
          format: ${{ env.TRIVY_OUTPUT_FORMAT }}
          output: "trivy-image.sarif"
          severity: ${{ env.TRIVY_SEVERITY }}
          exit-code: "0"
          trivyignores: ".trivyignore"

      - name: Upload Trivy image SARIF to Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-image.sarif"
          category: "trivy-image"

      - name: Upload Trivy image SARIF artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-image-sarif
          path: trivy-image.sarif

  # Optional enforcement job: uncomment or enable if you want pushes to main to fail on HIGH/CRITICAL findings
  trivy-enforce:
    name: Trivy Enforce on main (opt-in)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [prepare-cache]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan (enforce)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: ${{ env.TRIVY_OUTPUT_FORMAT }}
          output: "trivy-fs-enforce.sarif"
          severity: ${{ env.TRIVY_SEVERITY }}
          exit-code: "1"
          trivyignores: ".trivyignore"

      - name: Run Trivy image scan (enforce) - optional if you build images in CI
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "image"
          image-ref: "tranc3:${{ github.sha }}"
          format: ${{ env.TRIVY_OUTPUT_FORMAT }}
          output: "trivy-image-enforce.sarif"
          severity: ${{ env.TRIVY_SEVERITY }}
          exit-code: "1"
          trivyignores: ".trivyignore"

      - name: Upload enforcement SARIF to Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-fs-enforce.sarif"
          category: "trivy-fs-enforce"

      - name: Upload enforcement SARIF artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-enforce-sarif
          path: |
            trivy-fs-enforce.sarif
            trivy-image-enforce.sarif
