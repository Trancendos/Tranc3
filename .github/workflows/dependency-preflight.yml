# Read-only, focused dependency signal before downstream test/image failures.
# Path-filtered: not a required status check for unrelated PRs.
name: Dependency Compatibility Preflight

on:
  pull_request:
    branches: [main, develop]
    paths:
      - '**/requirements*.txt'
      - 'renovate.json'
      - '.github/dependabot.yml'
      - 'scripts/check_otel_lockstep.py'
      - 'scripts/check_dependency_bot_safety.py'
      - 'tests/test_dependency_bot_safety.py'
      - '.github/workflows/dependency-preflight.yml'
  push:
    branches: [main, develop]
    paths:
      - '**/requirements*.txt'
      - 'renovate.json'
      - '.github/dependabot.yml'
      - 'scripts/check_otel_lockstep.py'
      - 'scripts/check_dependency_bot_safety.py'
      - 'tests/test_dependency_bot_safety.py'
      - '.github/workflows/dependency-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-preflight-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bot-policy:
    name: Dependency bot safety
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Verify automated update governance
        run: |
          python scripts/check_dependency_bot_safety.py
          python -m unittest discover -s tests -p 'test_dependency_bot_safety.py' -v

  security-resolver:
    name: Security toolchain resolution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Verify standalone security toolchain requirements
        shell: bash
        run: |
          set -euo pipefail
          if ! python -m pip install --dry-run --ignore-installed --disable-pip-version-check -r requirements-security.txt > "$RUNNER_TEMP/security-resolution.log" 2>&1; then
            echo '## Security toolchain dependency resolution failed' >> "$GITHUB_STEP_SUMMARY"
            echo 'Check conflicting scanner/transitive version bounds, e.g. safety and filelock; do not suppress or bypass the resolver.' >> "$GITHUB_STEP_SUMMARY"
            tail -n 75 "$RUNNER_TEMP/security-resolution.log"
            exit 1
          fi
          echo 'Security toolchain requirements resolved without installation.' >> "$GITHUB_STEP_SUMMARY"

  resolver:
    name: Python dependency resolution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Detect incompatible OpenTelemetry pins before pip
        run: python scripts/check_otel_lockstep.py
      - name: Prove root requirements resolve without installation
        shell: bash
        run: |
          set -euo pipefail
          if ! python -m pip install --dry-run --ignore-installed --disable-pip-version-check -r requirements.txt > "$RUNNER_TEMP/dependency-resolution.log" 2>&1; then
            echo '## Dependency resolution failed' >> "$GITHUB_STEP_SUMMARY"
            echo 'Inspect resolver output and coordinate related dependency versions before merging.' >> "$GITHUB_STEP_SUMMARY"
            tail -n 65 "$RUNNER_TEMP/dependency-resolution.log"
            exit 1
          fi
          echo 'Root dependencies resolved without installing packages.' >> "$GITHUB_STEP_SUMMARY"
