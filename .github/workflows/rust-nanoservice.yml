name: Rust Nanoservice CI

# `src/nanoservices/rust/tranc3-nanoservice` is the only Rust that ships in the
# product. It had no CI at all: rust.yml is scoped to `aeonmind/rust/**` and
# runs with working-directory aeonmind/rust, so it has never looked at this
# crate. A Rust CI that runs, reports green, and cannot see the Rust that ships
# is the same as no Rust CI, only harder to notice.
#
# This is a separate workflow rather than a fourth job in rust.yml because a
# path filter applies to the whole file: adding this crate's paths there would
# also fire the aeonmind jobs, and `aeonmind-core` does not currently compile
# (2× E0599). Two unrelated crates, two triggers.
#
# What the unwatched crate turned out to be carrying, once looked at: its
# manifest asked reqwest 0.13 for a feature named `rustls-tls`, which 0.13
# renamed to `rustls`, so `cargo generate-lockfile` refused before compilation
# began — and behind that sat two more breaks against cryptoki 0.12 and
# secrecy 0.10.

on:
  push:
    paths:
      - 'src/nanoservices/rust/**'
      - '.github/workflows/rust-nanoservice.yml'
    branches: [ main, 'phase-*' ]
  pull_request:
    paths:
      - 'src/nanoservices/rust/**'
      - '.github/workflows/rust-nanoservice.yml'
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  check:
    name: Nanoservice Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/nanoservices/rust/tranc3-nanoservice
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/nanoservices/rust/tranc3-nanoservice/target
          key: ${{ runner.os }}-cargo-nano-${{ hashFiles('src/nanoservices/rust/tranc3-nanoservice/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-nano-
      # The lockfile must resolve against the manifest without being rewritten.
      # This is the step that fails on a renamed or dropped feature, and it is
      # exactly what was missing: the reqwest break stopped resolution dead, so
      # nothing further in would have reported anything useful.
      - name: Verify lockfile resolves
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Check
        run: cargo check --locked
      - name: Release build
        run: cargo build --release --locked
      # Deliberately no `cargo fmt --check` and no `clippy -D warnings`. Both
      # are red on this crate today (53 warnings, and formatting drift across
      # most files), and a gate that is red on arrival teaches people to ignore
      # it. Worth adding — separately, with the cleanup that makes it pass.
