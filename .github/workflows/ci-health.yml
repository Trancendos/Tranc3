name: CI Health

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      remediate_run_id:
        description: "Optional canonical run ID to retry only a safe bootstrap failure"
        required: false
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: ci-health
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Inspect canonical workflow health
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REMEDIATE_RUN_ID: ${{ inputs.remediate_run_id }}
        run: |
          if [ -n "$REMEDIATE_RUN_ID" ]; then
            python scripts/ci_health.py --remediate-run-id "$REMEDIATE_RUN_ID"
          else
            python scripts/ci_health.py
          fi
