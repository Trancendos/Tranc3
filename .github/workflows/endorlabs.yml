name: Endor Labs
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '42 19 * * 6'
jobs:
  scan:
    permissions:
      security-events: write # Used to upload sarif artifact to GitHub
      contents: read # Used to checkout a private repository by actions/checkout.
      actions: read # Required for private repositories to upload sarif files. GitHub Advanced Security licenses are required.
      id-token: write # Used for keyless authentication to Endor Labs
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    #### Package Build Instructions
    ### Use this section to define the build steps used by your software package.
    ### Endor Labs builds your software for you where possible but the required build tools must be made available.
    # - name: Setup Java
    #   uses: actions/setup-java@v4
    #   with:
    #     distribution: 'microsoft'
    #     java-version: '17'
    # - name: Build Package
    #   run: mvn clean install
    # `namespace: "example"` shipped with the marketplace template and was
    # never replaced, so every run authenticated against a tenant that does
    # not exist and endorctl 404'd before reading any code. The namespace is a
    # tenant identifier rather than a credential, so it belongs in a
    # repository variable: set `ENDOR_NAMESPACE` and these steps start working
    # with no further edit. Until it is set they are skipped with a notice,
    # because a scan that cannot authenticate is not a finding about this
    # repository and should not be reported as one.
    - name: Is an Endor Labs namespace configured?
      id: namespace
      env:
        ENDOR_NAMESPACE: ${{ vars.ENDOR_NAMESPACE }}
      run: |
        if [ -n "$ENDOR_NAMESPACE" ]; then
          echo "configured=true" >> "$GITHUB_OUTPUT"
        else
          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "::notice title=Endor Labs scan skipped::Set the repository variable ENDOR_NAMESPACE to your Endor Labs tenant namespace to enable this scan. Until then it is skipped rather than failed."
        fi

    - name: Endor Labs scan pull request
      if: github.event_name == 'pull_request' && steps.namespace.outputs.configured == 'true'
      uses: endorlabs/github-action@b51bd06466b545f01a6ac788e3e1147695d3936c
      with:
        namespace: ${{ vars.ENDOR_NAMESPACE }}
        sarif_file: findings.sarif
    - name: Endor Labs scan monitor
      if: github.event_name == 'push' && steps.namespace.outputs.configured == 'true'
      uses: endorlabs/github-action@b51bd06466b545f01a6ac788e3e1147695d3936c
      with:
        namespace: ${{ vars.ENDOR_NAMESPACE }}
        ci_run: "false"
        sarif_file: findings.sarif
    - name: Upload SARIF to github
      if: steps.namespace.outputs.configured == 'true'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: findings.sarif
