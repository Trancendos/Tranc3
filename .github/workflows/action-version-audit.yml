name: Action Version Audit

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      fail_on_outdated:
        description: "Fail the run when outdated action pins are found"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  action-version-audit:
    name: Audit pinned GitHub Action versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # The audit talks to the API with GITHUB_TOKEN and needs no git
          # credentials after checkout, so leaving a token in .git/config
          # buys nothing and widens what a later step could reach.
          persist-credentials: false

      - name: Audit action references for version drift
        id: audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAIL_ON_OUTDATED: ${{ github.event.inputs.fail_on_outdated || 'false' }}
        run: python3 scripts/audit_action_versions.py

      - name: Upload audit summary artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: action-version-audit
          path: |
            ACTION_AUDIT.md
            action-audit.json
          if-no-files-found: warn
          retention-days: 30
