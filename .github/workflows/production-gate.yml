name: Production Gate

# GitHub Actions copy of .forgejo/workflows/production-gate.yml.
#
# Added as a deliberate, interim, cloud-only-phase measure, on the same
# reasoning as .github/workflows/deploy-cloudflare.yml and frontend-build.yml
# (see cloudflare/DEPLOY.md). The Forgejo original is pinned to
# `runs-on: self-hosted`, so it needs The Workshop's runner on the Citadel host
# that this phase explicitly defers standing back up — meaning the platform's
# own merge gate has not been running at all while it operates cloud-only.
#
# That is worth stating plainly: without this copy, the gate that is supposed to
# block a bad merge is simply absent, and its absence is invisible because a
# workflow that never runs reports nothing.
#
# Retire this copy once The Workshop is back and hybrid/local is reactivated,
# rather than maintaining both indefinitely. Until then, keep it in sync with
# the Forgejo original — they should differ only in this header, the runner, and
# the hardening (persist-credentials, timeout) added below.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  SECRET_KEY: ci-production-gate-secret-key-32chars-minimum
  JWT_SECRET: ci-production-gate-jwt-secret-32chars-minimum
  DATABASE_URL: sqlite:///./test.db
  REDIS_URL: redis://localhost:6379/0
  ENVIRONMENT: test

jobs:
  production-gate:
    name: Production merge gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Nothing here pushes; the gate only reads the tree and runs checks.
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: "3.11"
          cache: pip

      # The vulnerability census audits five npm surfaces as well as the Python
      # manifest. ubuntu-latest ships a Node, but a gate should not depend on
      # whichever version the image happens to carry this week.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -q
          # Test-runner extras, in case the requirements install is partial.
          pip install pytest-asyncio psycopg2-binary -q 2>/dev/null || true
          # The exact tool set scripts/pre_deploy_quality_gate.py declares in its
          # own `gate_tools` string — keep the two in step. Every one of these is
          # a hard requirement of that gate, and a missing one fails it in a way
          # that reads as a code problem rather than a setup problem: absent
          # bandit reports "0 medium+ issue(s) (exit 1)" (a block with an empty
          # finding list), and absent ruff blocks before a single check runs.
          #
          # Versions are pinned, not latest. A merge gate whose linter floats can
          # go red on a new upstream release with no change in this repo, which
          # makes the signal untrustworthy exactly when it matters. bandit and
          # pip-audit come from requirements-security.txt (the repo's declared
          # versions); ruff matches the 0.15.8 already pinned in ci.yml,
          # python.yml and test.yml, so the gate and the lint checks cannot
          # disagree about what passes.
          #
          # Not `|| true` — if the gate's own tooling cannot be installed, the
          # gate is not running, and that should fail loudly here.
          pip install pytest pytest-asyncio "ruff==0.15.8" -q
          pip install -r requirements-security.txt -q

      - name: Merge gate tests
        run: |
          python -m pytest \
            tests/test_smoke.py \
            tests/test_knowledge_brain.py \
            tests/test_gbrain_worker.py \
            tests/test_canonical_routes.py \
            tests/test_compatibility.py \
            tests/test_entity_effective.py \
            tests/test_health_metadata.py \
            tests/test_orchestrator_effective.py \
            tests/test_zero_cost_registry.py \
            tests/test_url_validation.py \
            tests/test_adaptive_rotator.py \
            tests/test_api_startup_readiness.py \
            tests/test_production_readiness_stack.py \
            tests/test_live_deploy_contract.py \
            tests/test_p0_health_syntax.py \
            tests/test_p0_metrics_mount.py \
            -q --tb=short

      - name: API import gate
        run: python -c "import api; print('api OK')"

      - name: Citadel compose validate
        run: python3 scripts/citadel_compose_validate.py

      - name: Port registry validate (CLAUDE.md vs compose)
        run: python3 scripts/port_registry_validate.py

      - name: Duplicate router guard (api.py vs deployed workers)
        run: python3 scripts/check_duplicate_routers.py

      # The compose-config step below proves the *schema* is valid using synthesised
      # placeholder values. It deliberately says nothing about whether the real
      # generator can produce those values — and it could not: 47 of 53 required
      # variables were never generated, so a genuine `deploy_live.sh` run on the
      # Citadel host would have died before starting a container. This step closes
      # that gap without needing docker or secrets.
      - name: Generated env covers every compose-required variable
        run: python3 scripts/check_env_covers_compose.py

      - name: Docker compose config (production)
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            echo "SKIP: docker not available (compose YAML validated via citadel_compose_validate.py)"
            exit 0
          fi
          # docker-compose.production.yml uses ${VAR:?required} for all of its
          # secrets (53 at last count). That fail-fast is correct for a real deploy
          # and wrong for a syntax check: this step validates the compose *schema*,
          # not whether an operator has populated a .env. On the Citadel host a real .env exists,
          # so the Forgejo original never hit this — on a hosted runner it aborts on
          # the first missing variable and every later check in the file goes
          # unvalidated.
          #
          # Synthesise a throwaway value per required variable, derived from the
          # compose file itself so new secrets are covered automatically instead of
          # drifting against a hardcoded list here.
          env_file="$(mktemp)"
          # Only clean up the stub if this step is the one that created it.
          # The unconditional `rm -f .env.production` this replaces was safe
          # only by accident of the runner: on ubuntu-latest the file never
          # exists, but the same step on any self-hosted runner would delete
          # the operator's real, populated secrets file. The Forgejo copy
          # already guarded this; the guard is ported here so the two agree
          # on the safe behaviour rather than on the lucky one.
          stub_env=""
          cleanup() {
            rm -f "$env_file"
            if [ -n "$stub_env" ]; then rm -f .env.production; fi
          }
          trap cleanup EXIT
          grep -o '\${[A-Za-z0-9_]*:?[^}]*}' docker-compose.production.yml \
            | sed 's/^\${//; s/:?.*//' | sort -u \
            | sed 's/$/=ci-validation-placeholder/' > "$env_file"
          echo "Synthesised $(wc -l < "$env_file") placeholder variables for validation."
          # Every worker inherits `env_file: .env.production` via the
          # x-worker-common anchor. That file is operator-supplied and gitignored
          # (.gitignore's `.env.*`), so it is absent in a fresh checkout and Compose
          # refuses to resolve the project without it. An empty stub satisfies the
          # reference; the values in it are irrelevant to a schema check.
          if [ ! -f .env.production ]; then
            stub_env=1
            : > .env.production
          fi
          docker compose --env-file "$env_file" -f docker-compose.production.yml config --quiet

      - name: Citadel preflight (compose contracts)
        run: python3 scripts/citadel_preflight.py

      - name: Pre-deploy quality gate (critical only)
        run: python3 scripts/pre_deploy_quality_gate.py

      # Produces logs/vulnerability_census.json, which the security dimension
      # below reads. Without it that score is computed from presence checks alone
      # -- which is how it reported 100% while 31 vulnerabilities were open on the
      # default branch. --check fails here on any FIXABLE finding; an unfixable
      # one recorded in SECURITY_ALERT_REGISTER.md counts as accepted and passes.
      # --scope core keeps this to the root manifests (~90s). The full estate --
      # every discovered worker manifest -- is swept daily by
      # .github/workflows/supply-chain-watch.yml, which alerts rather than blocks:
      # a worker CVE disclosed overnight should raise an issue, not redden a pull
      # request that never touched it.
      - name: Dependency vulnerability census
        run: python3 scripts/vulnerability_census.py --check --scope core

      - name: Security dimension score
        run: python3 scripts/security_score.py --min-percent 90

      - name: Production readiness scorecard
        run: python3 scripts/production_readiness_score.py

      - name: Dependency audit (pip-audit if installed)
        run: |
          pip install pip-audit -q 2>/dev/null || true
          python3 scripts/dependency_audit.py || true

      - name: Entity registry import gate
        run: |
          python -c "
          from src.entities.health_metadata import health_entity_block
          e = health_entity_block(8004, 'infinity-ws')
          assert e['lead_ai'], e
          assert e['pid'] == 'PID-NXS', e
          print('health_entity_block OK:', e['lead_ai'])
          "

      - name: Zero-cost registry audit
        run: python scripts/zero_cost_audit.py
