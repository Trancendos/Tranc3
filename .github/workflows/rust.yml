name: Rust CI

# The path filter used to be 'aeonmind/rust/**' alone, which is one of the
# tree's nine Cargo crates. A pull request touching rust_extensions/,
# workers/*-rs/ or src/nanoservices/ did not trigger this workflow at all, so
# eight crates went green without a rustc invocation. See the `crates` job and
# scripts/check_rust_crates.py.
on:
  push:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '**/*.rs'
      - 'config/estate/rust_crate_status.yaml'
      - 'scripts/check_rust_crates.py'
      - '.github/workflows/rust.yml'
    branches: [ main, 'phase-*' ]
  pull_request:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '**/*.rs'
      - 'config/estate/rust_crate_status.yaml'
      - 'scripts/check_rust_crates.py'
      - '.github/workflows/rust.yml'
    branches: [ main ]
  schedule:
    # A crate does not break when someone edits it; it breaks when a caret
    # range resolves to a new dependency release. All three crates recorded
    # broken today broke that way, on a day nobody touched them. A weekly run
    # is what notices that.
    - cron: '17 4 * * 1'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aeonmind/rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Run clippy
        run: cargo clippy --all-features -- -D warnings
      - name: Build
        run: cargo build --verbose
      - name: Build with Python bindings
        run: cargo build --features python
      - name: Build with WASM
        run: cargo build --features wasm

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aeonmind/rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
      - name: Run tests
        run: cargo test --all-features --verbose
      - name: Run tests (default features)
        run: cargo test --verbose

  maturin-build:
    name: Maturin Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aeonmind/rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Install maturin
        run: pip install maturin
      - name: Build wheel
        run: maturin build --release --features python

  crates:
    name: Every Rust crate compiles, or is recorded as not
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-crates-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-crates-
      - name: Install PyYAML
        # Pinned to the version requirements.txt already carries. Scorecard's
        # Pinned-Dependencies rule asks for a hash, which no workflow in this
        # repository does; version-pinning is the estate's convention
        # (publish-matrix-site.yml, ci.yml's ruff) and is what this matches.
        run: pip install "pyyaml==6.0.3"
      - name: Compile every crate and compare against the ledger
        run: python3 scripts/check_rust_crates.py
      - name: The gate must not have changed the tree it measured
        run: git diff --exit-code
