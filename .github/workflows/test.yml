# .github/workflows/test.yml
# Full test suite on push to main
# Zero-cost: GitHub Actions free tier (2,000 min/month for public repos)

name: Test Suite

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Full Pytest Suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # tests/ includes cases that read the real compliance/magna-carta
          # submodule content (e.g. Matrix Suites tests) — without this, the
          # submodule dirs are empty gitlinks on ubuntu-latest's fresh
          # checkout, and those tests silently fall back to "no suites"/404
          # instead of exercising real data.
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements-test.txt || true
          pip install -r requirements.txt || true
          pip install pytest pytest-asyncio pytest-cov || true

      - name: Run full test suite
        run: |
          python -m pytest tests/ \
            -v \
            --tb=short \
            -m "not integration and not chaos" \
            --ignore=tests/test_full_suite.py \
            --cov=Dimensional \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            || true  # Don't block main on test failures during stabilization

      # The Chaos Party is the platform's testing Location. Until this step
      # existed, CI ran pytest and told it nothing. /runs/batch also forwards to
      # The Observatory, so one post feeds both. Skips cleanly when
      # CHAOS_PARTY_URL is unset (a GitHub-hosted runner cannot reach a
      # compose-internal worker); fails loudly once it is set.
      - name: Report test run to The Chaos Party
        if: always()
        env:
          CHAOS_PARTY_URL: ${{ secrets.CHAOS_PARTY_URL }}
          INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
        run: python scripts/report_tests_to_chaos_party.py --ran-by ci

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  lint:
    name: Ruff Lint + Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install "ruff==0.15.8"

      - name: Ruff check
        run: |
          ruff check --select E,F,W,B --ignore E501,B008,B904 \
            --exclude "docs/reference" \
            .

      - name: Ruff format check
        run: |
          ruff format --check --diff \
            --exclude "docs/reference" \
            .
