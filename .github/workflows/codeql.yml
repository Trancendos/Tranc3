# .github/workflows/codeql.yml
# CodeQL static analysis for security vulnerabilities (CWE-022, etc.)
# This runs alongside Forgejo CI security-scan.yml (bandit + semgrep).
# CodeQL provides additional taint-tracking analysis that bandit/semgrep lack.
#
# Previous CodeQL alerts (#30-#41) were fixed in PR #29 by replacing
# _assert_under_base() with validate_path() in spawner.py. This workflow
# must exist on main so CodeQL re-scans and dismisses the resolved alerts.

name: "CodeQL Advanced"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "39 6 * * 5"

permissions:
  actions: read
  contents: read
  security-events: write
  packages: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
            packs: codeql/python-queries:AlertSuppression.ql
            sarif-name: python
          - language: javascript-typescript
            build-mode: none
            packs: codeql/javascript-queries:AlertSuppression.ql
            sarif-name: javascript

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        # Every github/codeql-action/* step in this job must resolve to the same
        # release: init writes a config stamped with its own version and analyze
        # refuses a config written by a different one ("Loaded a configuration
        # file for version '4.36.2', but running version '4.37.7'"). That split
        # is what took CodeQL red on main from 2026-08-22 to 2026-08-25, and a
        # pin bump silently dropped this comment once already -- so the rule is
        # now enforced by scripts/check_codeql_action_consistency.py in ci.yml
        # rather than trusted to this note.
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: .github/codeql-config.yml
          packs: ${{ matrix.packs }}

      - name: Perform CodeQL Analysis
        id: analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"
          output: sarif-results
          upload: false

      # Was an inline heredoc that removed EVERY alert whose location fell in
      # one of three files, at every rule and every severity, under a step name
      # that said "path-injection". A SQL injection or hardcoded credential
      # introduced in one of those files would have been deleted before it
      # reached the Security tab, with nothing left to show it had existed.
      #
      # Now a script, so it can be tested: it drops an alert only when the file
      # is adjudicated AND the rule is a path-injection rule, prints what it
      # dropped, keeps and reports anything else those files raise, and fails
      # if an adjudicated path no longer exists.
      #
      # `--strict-surprises` because the alternative is the failure this
      # replaced, one step removed: an unadjudicated rule in an adjudicated file
      # would be kept and printed while the job went green, and nobody reads a
      # green job. A new rule in one of these three files is a decision
      # somebody has to make, so it stops the run until they make it.
      - name: Filter adjudicated path-injection false positives
        if: matrix.language == 'python'
        run: |
          python3 scripts/filter_codeql_alerts.py \
            sarif-results/python.sarif --strict-surprises

      # The SARIF exists only inside this job. It is uploaded to the Security
      # tab and then discarded, so the alerts are readable in exactly one
      # place, behind an authenticated web page, by exactly the people who can
      # already open it. That is why "5 high / 14 medium" has been reported on
      # nine consecutive commits of this pull request without anyone -- human
      # or agent -- being able to say WHICH five.
      #
      # A finding nobody can enumerate cannot be triaged, adjudicated, or
      # argued with. Retaining the artifact costs nothing and makes the alerts
      # readable by anything that can read SARIF, which now includes this
      # estate's own scanner:
      #
      #     gh run download <run-id> -n codeql-sarif-python
      #     python scripts/immune_scan.py --merge sarif-results/*.sarif
      #
      # Post-filter deliberately: this is the SARIF that actually became the
      # alerts, so what you download is what the Security tab shows. The
      # filter step prints every alert it dropped and fails on a surprise, so
      # the suppressed set stays auditable from the job log.
      #
      # It worked on the first run that carried it. The five were all
      # py/path-injection in workers/storage-service/worker.py, all pre-existing
      # on main, and all now fixed -- SECURITY_ALERT_REGISTER.md SEC-009 has the
      # alert list, the exploit shapes and the remediation. The same download
      # also named three critical alerts nobody had ever seen, which is the
      # actual argument for this step: the count was never the finding.
      - name: Retain SARIF so the alerts can be read outside the Security tab
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codeql-sarif-${{ matrix.sarif-name }}
          path: sarif-results/${{ matrix.sarif-name }}.sarif
          if-no-files-found: warn
          retention-days: 30

      - name: Upload SARIF results
        id: upload_sarif
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: sarif-results/${{ matrix.sarif-name }}.sarif
          category: "/language:${{ matrix.language }}"

      - name: Dismiss suppressed alerts
        if: github.ref == 'refs/heads/main'
        uses: advanced-security/dismiss-alerts@a18f986bdb40edba0dd7a74382c15d4a3d50a1c8 # v2
        with:
          sarif-id: ${{ steps.upload_sarif.outputs.sarif-id }}
          sarif-file: sarif-results/${{ matrix.sarif-name }}.sarif
        env:
          GITHUB_TOKEN: ${{ github.token }}
