# .github/workflows/ci.yml
# Continuous Integration — lint + test on every PR
# Zero-cost: GitHub Actions free tier (2,000 min/month for public repos)

name: CI

on:
  pull_request:
    branches: ["main", "develop"]
  push:
    branches: ["main", "develop"]

permissions:
  contents: read

jobs:
  lint:
    name: Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install "ruff==0.15.8"

      - name: Ruff check
        run: |
          ruff check --select E,F,W,B --ignore E501,B008,B904 \
            --exclude "docs/reference" \
            --exclude ".forgejo" \
            .

      - name: Ruff format check
        run: |
          ruff format --check --diff \
            --exclude "docs/reference" \
            --exclude ".forgejo" \
            .

  topology:
    # Two classes of defect that no test can catch, because both only fail
    # inside a built container while passing locally: a service calling a
    # sibling on `localhost`, and a worker importing a package its Docker build
    # context excludes. Both are cheap static checks against compose itself.
    name: Service Topology
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The History integrity step needs real history. The default depth of 1
          # gives a graft boundary that `rev-list --max-parents=0` reports as a
          # root, and no origin/main at all — which is how the first version of
          # that check silently verified nothing. The script also deepens `main`
          # itself (so it works on Forgejo and locally); this makes it certain here.
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      # PyYAML for the compose checks; pydantic because the guards below now
      # import real platform modules rather than re-parsing them. That is what
      # lets them check the thing itself — check_lab_languages.py reads the
      # language registry, generate_plm_docs.py renders from the gate criteria
      # — and src/event_bus/types.py, which the PLM imports for its event
      # enum, is built on pydantic.
      - name: Install PyYAML and pydantic
        run: pip install PyYAML pydantic

      - name: Cross-service URL check
        run: python scripts/check_service_urls.py

      - name: Build-context import check
        run: python scripts/check_worker_build_context.py

      # Catches the one way named build contexts fail: a Dockerfile that copies
      # `--from=sharedcore` while its compose entry supplies no such context.
      # That builds fine for anyone passing --build-context by hand and fails
      # only in the deployment, so it has to be caught here.
      - name: Shared-core build-context check
        run: python scripts/apply_shared_core_contexts.py --check

      # Fails if any service compares the internal secret in-line again. The
      # estate had 77 such gates, 28 timing-unsafe and 10 fail-open; this is
      # what stops an 85th appearing.
      - name: Internal-auth delegation check
        run: python scripts/migrate_internal_auth.py --check

      # The shared web-framework stack (fastapi/starlette/pydantic/uvicorn/redis)
      # is restated in 86 requirements files. Left unguarded it drifts — the
      # estate once held 5 different uvicorn pins at once — and drift on this
      # stack is coupled: fastapi constrains starlette and pydantic, so a
      # sliding pin can stop satisfying its own framework at image-build time.
      # Pins main's root commit, so a real history rewrite (re-root, whole-graph
      # squash, force push of an unrelated tree) fails on the commit that causes
      # it rather than surfacing months later as "why is every branch
      # unmergeable?". It deepens main itself first: on the shallow clone
      # actions/checkout produces, `rev-list --max-parents=0` returns a graft
      # boundary that is indistinguishable from a root, and `merge-base` reports
      # perfectly related branches as unrelated — a trap that already produced
      # one confident, wrong conclusion (see BRANCH-SALVAGE-ANALYSIS.md §3).
      - name: History integrity
        run: python scripts/check_history_integrity.py

      - name: Framework pin alignment
        run: python scripts/align_framework_pins.py --check

      # The pin check above only sees the tree. It cannot see that both
      # dependency bots were configured to propose the very packages that
      # script governs, which made those PRs unmergeable by construction
      # (#1139/#1140/#1141) and set automerge on a 63-file framework change
      # (#1054). Both configs are fixed; this keeps them fixed, including the
      # ordering rule -- a Renovate block undone by a rule placed below it.
      - name: Canonical pin governance
        run: python scripts/check_canonical_pin_governance.py

      # production-gate.yml's own comment claims the 0.15.8 pin means "the gate
      # and the lint checks cannot disagree about what passes". True across the
      # workflows; false across the full lint surface, because
      # .pre-commit-config.yaml pinned ruff v0.16.4 -- a second formatter running
      # on every commit and as a PR status. 0.16.x formats Python inside Markdown
      # fences and 0.15.8 does not, a ten-file difference here. Latent only
      # because the ruff hooks are typed to Python, which is not a guarantee.
      - name: Ruff pin alignment
        run: python scripts/check_ruff_pin_alignment.py

      # conftest.py guards four shared auth env vars, and that guard works -- but
      # it is module-scoped, so it can only report which module FINISHED with a
      # value wrong, not which one set it. When the write is at import time, the
      # module it blames is chosen by collection order. On 2026-09-03 it blamed
      # tests/core/test_dependencies.py for a write in tests/test_backup_service.py,
      # and because the Pytest job then ran with `-x`, that single teardown error
      # stopped the run after four tests while `|| true` reported the job green.
      # tests/test_encrypted_sqlite.py had the same bug, was fixed, and the sibling
      # was missed -- which is the argument for a check rather than a comment.
      - name: Test env isolation
        run: python scripts/check_test_env_isolation.py

      # Every dependency surface the census scans must have a Location that
      # answers for it. Without the join, a finding names a manifest path and
      # nobody -- and an unrouted finding is indistinguishable from no finding
      # at all in a summary, so exposure disappears rather than being reported.
      # Fails on an unowned surface, on a mapping whose path has moved, and on
      # one naming a Location that is not among the 43.
      - name: DVMS surface ownership
        run: python scripts/check_surface_ownership.py

      # .trivyignore silences findings in three scanners at once, and a bare id
      # on a line is valid Trivy syntax. This requires every entry to carry a
      # written justification, a re-check trigger, and -- for a vulnerability
      # id -- a matching record in the accepted-risk register, so a suppression
      # stays a decision rather than becoming a blind spot. Two of the four
      # existing entries had no trigger when this was added.
      # Offline only: the upstream OSV check is opt-in and runs on the Trivy
      # schedule, because a gate whose verdict depends on a third party's
      # uptime fails for reasons unrelated to the tree.
      - name: Trivy suppression governance
        run: python scripts/check_trivyignore_governance.py

      # CodeQL raised twelve py/unreachable-statement alerts in
      # src/agents/goal_manager.py and the SARIF filter's --strict-surprises is
      # the only reason anybody looked. A sweep found fifteen more in six other
      # files and api.py -- twenty-seven bare `return None`s after a block that
      # always leaves the frame, several under a `-> bool` they contradicted.
      # CodeQL had been raising most of them into a tab that gates nothing.
      # This runs in about a second and FAILS, which is the whole difference.
      - name: Unreachable code
        run: python scripts/check_unreachable_code.py

      # The PLM policy and procedure are rendered from the gate criteria in
      # src/townhall/plm.py, because a hand-written governance document drifts
      # in exactly the situation where somebody reads it instead of the code.
      # This fails when the committed copy no longer matches.
      - name: PLM gate documentation is current
        run: python scripts/generate_plm_docs.py --check

      # Several creative Locations ship two FastAPI apps — a thin main.py and
      # a richer worker.py — and only the Dockerfile CMD says which one runs.
      # The first creative route table read the interesting file rather than
      # the deployed one and marked Warp Radio ROUTED at a POST its image does
      # not serve. This verifies every declared endpoint against the module
      # the container actually executes.
      - name: Creative routes exist in the deployed image
        run: python scripts/check_creative_routes.py

      # This job's own pip install line, checked against what its steps
      # actually import. The guards here read real platform modules now —
      # that is what lets them check the thing rather than a copy of it —
      # so the day one of those modules grows a dependency, this job breaks
      # several import hops from anything the change touched. It broke
      # exactly that way when the PLM started importing the event-type enum.
      - name: CI job installs what its scripts import
        run: python scripts/check_ci_job_dependencies.py

      # Guards the invariant that took CodeQL red on main for three days:
      # init stamps its config with its own release version and analyze
      # rejects a config from a different one, so every
      # github/codeql-action/* pin inside one workflow file must match.
      - name: CodeQL action pin consistency
        run: python scripts/check_codeql_action_consistency.py

      # Seven workflows are duplicated across .github/ and .forgejo/.
      # production-gate.yml's own header declares they should differ only in
      # the header, the runner, and the hardening -- and nothing enforced that,
      # so the Forgejo copy of the merge gate had silently lost the dependency
      # vulnerability census. Forgejo being dormant is what hid it: the weaker
      # gate is the one that takes over when The Workshop is stood back up.
      - name: Workflow drift (GitHub vs Forgejo copies)
        run: python scripts/check_workflow_drift.py --check

      - name: Service review freshness
        run: python scripts/build_service_review.py --check

      # Guards an ADOPTED timing profile against rot; a no-op until one is
      # bootstrapped, because failing CI for a feature nobody has turned on yet
      # is noise. Once `.test-timings.json` exists, a profile that has fallen
      # below 80% coverage of the collected suite fails here -- below that the
      # shard split degrades toward balancing test COUNTS, which is the wrong
      # quantity and silently gives back the wall-clock win.
      - name: Test timing profile freshness
        run: python scripts/test_intelligence.py --check

      # web/ declares dependency overrides in three places, each read by a
      # different installer (npm / pnpm 10 / pnpm 11+). Those entries exist to
      # force transitive packages past published advisories, so drift between
      # them does not break a build -- it silently un-patches whichever installer
      # was left behind. Both halves of that have already happened here: a pnpm
      # lockfile serving vulnerable dompurify while npm was patched, and an
      # override declared only under the `pnpm` key that pnpm 11 ignores.
      - name: Dependency override sync
        run: python scripts/check_override_sync.py

      # Model identifiers are not dependencies any package manager understands --
      # they are bare strings in adapters and env defaults, so dependency scanning
      # walks straight past them. This fails when code references a model that is
      # not declared in config/ai_models.yaml with a licence, an execution location
      # and a data-egress answer. Fast and network-free, unlike the obsolescence
      # census, so it belongs on every PR.
      - name: AI model inventory drift
        run: python scripts/ai_bom.py --check

      # The estate states its architecture as flow -- "all MCP routes through The
      # Spark", "all secrets flow into The Void" -- and until the flow contract
      # existed, none of those claims could be checked, so none could be
      # maintained. This measures each declared flow against the working tree.
      #
      # It fails on REGRESSION only, against config/estate/flow_baseline.json --
      # not on the standing backlog of flows that are built and reached by
      # nothing. A gate that is red on day one for reasons nobody can fix that
      # day teaches people to wave it through, which is the failure it exists to
      # prevent. Improving a flow means refreshing the baseline, which is a
      # visible act in the diff rather than a silent one.
      #
      # Pure filesystem and grep work, no network: it belongs on every PR.
      # Fails when a Location's worker_path is missing, unserved, shared with
      # another Location, or when its worker_port disagrees with compose. The
      # registry is the platform's identity source of truth; when it drifts,
      # the Admin OS worker map goes blind without saying so.
      - name: Entity registry conformance
        run: python scripts/entity_registry_conformance.py --check

      - name: Location flow conformance
        run: python scripts/flow_conformance.py --check

      # MATRIX-INDEX.md's inventory is generated, so it cannot silently fall
      # behind the filesystem the way the hand-written list did -- 51 of 68
      # matrix documents were absent from it when this was measured. The
      # editorial judgement above the generated block stays hand-written.
      # Deliberately submodule-independent: the check returns the same answer
      # with compliance/magna-carta/ present or absent, so it cannot fail here
      # for an environmental reason.
      - name: Matrix index freshness
        run: python scripts/build_matrix_index.py --check

      # The PID column joins the EA service inventory to the entity registry.
      # Without it, Tier3AI was free text nothing could check, and the CMDB had
      # drifted from the registry unnoticed. The floor is a ratchet: coverage
      # may rise, and a change that drops it below the recorded measurement
      # fails here rather than quietly un-joining the two halves of the estate.
      - name: PID coverage
        run: python scripts/pid_coverage.py --check

      # The AI governance register held three cards while the estate ran a
      # crisis classifier, an empathy wrapper and a third-party model router
      # that appeared in it nowhere. A register nothing checks falls behind the
      # code silently, so adding an AI surface now fails here until it is
      # registered -- and a high-risk system cannot be quietly downgraded.
      - name: AI register conformance
        run: python scripts/check_ai_register.py

  test:
    name: Pytest
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # tests/ includes cases that read the real compliance/magna-carta
          # submodule content (e.g. Matrix Suites tests) — without this, the
          # submodule dirs are empty gitlinks on ubuntu-latest's fresh
          # checkout, and those tests silently fall back to "no suites"/404
          # instead of exercising real data.
          submodules: recursive

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements-test.txt || true
          pip install -r requirements.txt || true
          pip install pytest pytest-asyncio pytest-cov || true

      # Coverage is produced here rather than in a second workflow. `codecov.yml`
      # ran the whole suite again, on every PR and every push to main, purely to
      # attach --cov flags and upload the result -- a second full-suite run whose
      # only difference was the flags, and which was suppressed with `|| true`
      # exactly as this one was at the time, so it gated nothing either.
      # Measuring coverage over the run that already happens costs nothing
      # extra.
      #
      # That suppression is gone as of f98aadb4: this step now fails the job
      # when a test fails. The paragraph above is history, not a description
      # of the current run — kept because it explains why codecov.yml was
      # retired rather than fixed.
      #
      # This selection is narrower than codecov.yml's was: `integration` is
      # documented in pyproject.toml as "requires live external services", which
      # CI does not have, so those tests could only ever error. They contributed
      # no coverage there and their absence costs none here.
      #
      # Also strictly better than codecov.yml's run: that job checked out
      # WITHOUT `submodules: recursive`, so every test reading real
      # compliance/magna-carta content saw an empty gitlink and silently took a
      # "no suites"/404 path. This job checks them out.
      # No `-x`. With it, this job ran FOUR tests and one error, stopped, and
      # `|| true` reported success -- measured on run 33808374262, whose entire
      # pytest output was `....E` followed by "stopping after 1 failures". The
      # suppression was not "run everything and ignore failures"; it was "run
      # five tests and ignore the result", and coverage folded in here would
      # have been measured over those five.
      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -q --tb=short \
            -m "not integration and not chaos" \
            --ignore=tests/test_full_suite.py \
            --cov=src --cov=workers \
            --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: ./coverage.xml
          flags: unittests,workers
          name: tranc3-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
