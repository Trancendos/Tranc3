name: IceBox isolated policy tests

on:
  pull_request:
    paths:
      - "src/security/ice_box/automation_policy.py"
      - "integrations/icebox_ycloud/**"
      - "integrations/icebox_temporal/**"
      - "workers/ice-box-service/worker.py"
      - "tests/test_ice_box_automation_stdlib.py"
      - "tests/test_build_topology_sections.py"
      - "scripts/build_topology_3d.py"
      - "docs/architecture/topology-3d.json"
      - ".github/workflows/icebox-policy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-policy:
    name: IceBox no-network policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Verify fail-safe security decisions without installing root dependencies
        run: |
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_ice_box_automation_stdlib.py' -v
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_build_topology_sections.py' -v
