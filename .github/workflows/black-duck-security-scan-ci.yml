# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Black Duck Security Action allows you to integrate Static Analysis Security Testing (SAST) and Software Composition Analysis (SCA) into your CI/CD pipelines.
# For more information about configuring your workflow,
# read our documentation at https://github.com/blackduck-inc/black-duck-security-scan

name: CI Black Duck security scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '34 0 * * 1'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write
      actions: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # The action refuses to start unless at least one product is pointed at
      # a server: "Requires at least one scan type: (polaris_server_url,
      # coverity_url, blackducksca_url, srm_url)". None of the four is set
      # here, so every run failed at that check — a red X on every pull
      # request, from a scan that never looked at the code.
      #
      # Configuring any one product is enough. Set its URL as a repository
      # variable and its token as a repository secret and this scan starts
      # working with no edit to this file. Until then it is skipped with a
      # notice, which is the honest report: not "this repository failed a
      # security scan", but "no security scan ran".
      - name: Is any Black Duck product configured?
        id: products
        env:
          BLACKDUCKSCA_URL: ${{ vars.BLACKDUCKSCA_URL }}
          COVERITY_URL: ${{ vars.COVERITY_URL }}
          POLARIS_SERVER_URL: ${{ vars.POLARIS_SERVER_URL }}
          SRM_URL: ${{ vars.SRM_URL }}
        run: |
          if [ -n "$BLACKDUCKSCA_URL" ] || [ -n "$COVERITY_URL" ] \
             || [ -n "$POLARIS_SERVER_URL" ] || [ -n "$SRM_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Black Duck scan skipped::Set one of the repository variables BLACKDUCKSCA_URL, COVERITY_URL, POLARIS_SERVER_URL or SRM_URL (with its matching token secret) to enable this scan. Until then it is skipped rather than failed."
          fi

      - name: Black Duck SCA scan
        if: steps.products.outputs.configured == 'true'
        uses: blackduck-inc/black-duck-security-scan@805cbd09e806b01907bbea0f990723c2bb85abe9
        with:
          ### ---------- BLACKDUCK SCA SCANNING: REQUIRED FIELDS ----------
          blackducksca_url: ${{ vars.BLACKDUCKSCA_URL }}
          blackducksca_token: ${{ secrets.BLACKDUCKSCA_TOKEN }}

          ### ---------- COVERITY SCANNING: REQUIRED FIELDS ----------
          coverity_url: ${{ vars.COVERITY_URL }}
          coverity_user: ${{ secrets.COVERITY_USER }}
          coverity_passphrase: ${{ secrets.COVERITY_PASSPHRASE }}

          ### ---------- POLARIS SCANNING: REQUIRED FIELDS ----------
          polaris_server_url: ${{ vars.POLARIS_SERVER_URL }}
          polaris_access_token: ${{ secrets.POLARIS_ACCESS_TOKEN }}
          polaris_assessment_types: "SCA,SAST"

          ### ---------- SRM SCANNING: REQUIRED FIELDS ----------
          srm_url: ${{ vars.SRM_URL }}
          srm_apikey: ${{ secrets.SRM_API_KEY }}
          srm_assessment_types: "SCA,SAST"
