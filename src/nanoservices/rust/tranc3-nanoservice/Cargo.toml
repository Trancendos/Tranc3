[package]
name = "tranc3-nanoservice"
version = "0.1.0"
edition = "2021"
description = "Tranc3 adaptive storage nanoservice with CRUSH-aware placement, multi-cloud fallback, and HSM integration"
authors = ["Drew Porter <drew@trancendos.com>"]
license = "MIT"

[[bin]]
name = "tranc3-nano"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client.
# The feature is `rustls`, not `rustls-tls`. reqwest renamed it in 0.13, and
# this manifest kept the 0.12 spelling, so `cargo generate-lockfile` here fails
# outright: "depends on reqwest with feature rustls-tls but reqwest does not
# have that feature". The crate has not been buildable. Nothing caught it
# because .github/workflows/rust.yml is scoped to `aeonmind/rust/**` and runs
# with working-directory aeonmind/rust — it has never looked at this crate,
# which is the only Rust that ships in the product. (#1228)
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# PKCS#11 HSM integration
cryptoki = "0.12"

# Cryptography
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"

# HTTP server (lightweight)
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

# System
libc = "0.2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Metrics
prometheus = "0.14"

# Bytes
bytes = "1"

# Async trait
async-trait = "0.1"

# Error handling
thiserror = "2"

# HTTP types
http = "1"

# URL parsing
url = "2"

[profile.release]
opt-level = "z"       # Optimize for size
lto = true            # Link-time optimization
codegen-units = 1     # Max optimizations
strip = true          # Strip symbols
panic = "abort"       # Smaller binary
