name: E2E (Playwright)

on:
  push:
    branches: [main]
    paths:
      - 'tests/e2e/**'
      - 'api.py'
      - 'src/**'
  pull_request:
    paths:
      - 'tests/e2e/**'
      - 'api.py'
      - 'src/**'

jobs:
  playwright:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install Playwright dependencies
        working-directory: tests/e2e
        # `npm ci`, not `npm install`: tests/e2e now carries a lockfile, so the
        # transitive tree is pinned by integrity hash instead of being resolved
        # fresh on every run. --ignore-scripts blocks lifecycle hooks, which is
        # where the recent npm supply-chain worms put their payload. Nothing is
        # lost: the only hook in this tree is fsevents (macOS-only), and the
        # browser download is the explicit step below, not a postinstall.
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      - name: Start API server
        run: |
          SECRET_KEY=ci-test-secret-key nohup uvicorn api:app --host 0.0.0.0 --port 8000 \
            > api-server.log 2>&1 &
          ready=0
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then
              ready=1; break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat api-server.log || true; exit 1; fi

      - name: Run Playwright tests
        working-directory: tests/e2e
        run: npm test
        env:
          BASE_URL: http://localhost:8000

      - name: Dump API server log on failure
        if: failure()
        run: cat api-server.log || true
