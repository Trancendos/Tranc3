name: Production Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  production-gate:
    name: Production merge gate
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Do not leave the checkout token in .git/config where any later
          # step could read or push with it. The GitHub copy has always
          # set this; this one had not.
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip

      # The vulnerability census audits five npm surfaces as well as the Python
      # manifest, so the gate needs a Node it can rely on rather than whatever
      # the runner image happens to carry. Pinned for the same reason the
      # Python tooling below is pinned: a gate whose toolchain floats can go
      # red with no change in this repo.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -q
          # Ensure test runner extras are present even if requirements install is partial
          pip install pytest-asyncio psycopg2-binary -q 2>/dev/null || true
          # The exact tool set scripts/pre_deploy_quality_gate.py declares in its
          # own `gate_tools` string — keep the two in step. A missing one fails
          # that gate in a way that reads as a code problem rather than a setup
          # problem (absent bandit reports "0 medium+ issue(s)" with an empty
          # finding list; absent ruff blocks before any check runs).
          #
          # Pinned, not latest: a gate whose linter floats can go red on an
          # upstream release with no change here. bandit and pip-audit come from
          # requirements-security.txt; ruff matches the 0.15.8 pinned across the
          # repo's lint workflows.
          pip install pytest pytest-asyncio "ruff==0.15.8" -q
          pip install -r requirements-security.txt -q

      - name: Merge gate tests
        run: |
          python -m pytest \
            tests/test_smoke.py \
            tests/test_knowledge_brain.py \
            tests/test_gbrain_worker.py \
            tests/test_canonical_routes.py \
            tests/test_compatibility.py \
            tests/test_entity_effective.py \
            tests/test_health_metadata.py \
            tests/test_orchestrator_effective.py \
            tests/test_zero_cost_registry.py \
            tests/test_url_validation.py \
            tests/test_adaptive_rotator.py \
            tests/test_api_startup_readiness.py \
            tests/test_production_readiness_stack.py \
            tests/test_live_deploy_contract.py \
            tests/test_p0_health_syntax.py \
            tests/test_p0_metrics_mount.py \
            -q --tb=short
        env:
          SECRET_KEY: ci-production-gate-secret-key-32chars-minimum
          JWT_SECRET: ci-production-gate-jwt-secret-32chars-minimum
          DATABASE_URL: sqlite:///./test.db
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test

      - name: API import gate
        run: python -c "import api; print('api OK')"
        env:
          SECRET_KEY: ci-production-gate-secret-key-32chars-minimum
          JWT_SECRET: ci-production-gate-jwt-secret-32chars-minimum
          DATABASE_URL: sqlite:///./test.db
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test

      - name: Citadel compose validate
        run: python3 scripts/citadel_compose_validate.py

      - name: Port registry validate (CLAUDE.md vs compose)
        run: python3 scripts/port_registry_validate.py

      - name: Duplicate router guard (api.py vs deployed workers)
        run: python3 scripts/check_duplicate_routers.py

      # The compose-config step below proves the *schema* is valid using synthesised
      # placeholder values. It deliberately says nothing about whether the real
      # generator can produce those values — and it could not: 47 of 53 required
      # variables were never generated, so a genuine `deploy_live.sh` run on this
      # very host would have died before starting a container. This step closes that
      # gap without needing docker or secrets.
      - name: Generated env covers every compose-required variable
        run: python3 scripts/check_env_covers_compose.py

      - name: Docker compose config (production)
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            echo "SKIP: docker not available on runner (compose YAML validated via citadel_compose_validate.py)"
            exit 0
          fi
          # Validate the compose *schema*, independently of whether this host has
          # a populated .env — that is what `citadel_preflight.py` and the deploy
          # itself are for. Secrets come from throwaway placeholders derived from
          # the compose file, so new required variables are covered automatically,
          # and the operator's real .env.production is left untouched (a stub is
          # only created when the file is genuinely absent).
          env_file="$(mktemp)"
          stub_env=""
          cleanup() {
            rm -f "$env_file"
            if [ -n "$stub_env" ]; then rm -f .env.production; fi
          }
          trap cleanup EXIT
          grep -o '\${[A-Za-z0-9_]*:?[^}]*}' docker-compose.production.yml \
            | sed 's/^\${//; s/:?.*//' | sort -u \
            | sed 's/$/=ci-validation-placeholder/' > "$env_file"
          if [ ! -f .env.production ]; then
            stub_env=1
            : > .env.production
          fi
          docker compose --env-file "$env_file" -f docker-compose.production.yml config --quiet

      - name: Citadel preflight (compose contracts)
        run: python3 scripts/citadel_preflight.py
        env:
          SECRET_KEY: ci-production-gate-secret-key-32chars-minimum
          JWT_SECRET: ci-production-gate-jwt-secret-32chars-minimum
          DATABASE_URL: sqlite:///./test.db
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test

      - name: Pre-deploy quality gate (critical only)
        run: python3 scripts/pre_deploy_quality_gate.py

      - name: Dependency vulnerability census
        run: python3 scripts/vulnerability_census.py --check --scope core

      # Kept in step with the GitHub copy deliberately. A disposition in
      # SECURITY_ALERT_REGISTER.md silences a finding the census would otherwise
      # block on, and two of them are justified by how this repository uses the
      # component rather than by the advisory. If that usage changes the
      # justification is void while the suppression keeps working, and this step
      # is what notices. Omitting it here is precisely the divergence that let
      # the Forgejo gate lose the census step once already.
      - name: Disposition premises still hold
        run: python3 scripts/check_disposition_premises.py

      - name: Security dimension score
        run: python3 scripts/security_score.py --min-percent 90

      - name: Production readiness scorecard
        run: python3 scripts/production_readiness_score.py

      - name: Dependency audit (pip-audit if installed)
        run: |
          pip install pip-audit -q 2>/dev/null || true
          python3 scripts/dependency_audit.py || true

      - name: Entity registry import gate
        run: |
          python -c "
          from src.entities.health_metadata import health_entity_block
          e = health_entity_block(8004, 'infinity-ws')
          assert e['lead_ai'], e
          assert e['pid'] == 'PID-NXS', e
          print('health_entity_block OK:', e['lead_ai'])
          "

      - name: Zero-cost registry audit
        run: python scripts/zero_cost_audit.py
