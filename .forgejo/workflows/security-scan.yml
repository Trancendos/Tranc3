# .forgejo/workflows/security-scan.yml
# The Workshop — Security scanning via Forgejo CI.
# NO GitHub Actions — all CI through Forgejo (The Workshop) only.
#
# Replaces ALL former GitHub Actions security workflows:
#   - codeql.yml          → replaced by bandit + semgrep (no CodeQL server needed)
#   - security-scan.yml   → merged here (pip-audit, bandit, npm audit, semgrep)
#   - security-dashboard.yml → merged here (aggregated reporting)
#   - security-gate.yml   → merged here (gate logic for medium+/high findings)
#   - ossf-scorecard.yml  → removed (GitHub-specific, not applicable to Forgejo)
#
# Runs: on every push, PRs to main, and weekly Sunday 02:00 UTC.
#
# Checks:
#   1. pip-audit    — Python CVE scanning (OSV + PyPI)
#   2. bandit       — Python SAST (OWASP Top 10) — medium+ severity GATE
#   3. ruff         — lint gate (no new violations)
#   4. semgrep      — semantic pattern matching (free LGPL-2.1, replaces CodeQL)
#                     configs: auto + p/fastapi
#   5. gitleaks     — detect hardcoded secrets (MIT)
#   6. trufflehog   — additional secret scanning (AGPL-3.0)
#   7. osv-scanner  — multi-ecosystem SCA (Google, Apache 2.0)
#   8. checkov      — Docker Compose + IaC misconfiguration (Apache 2.0)
#   9. syft+grype   — SBOM generation (CycloneDX) + vulnerability matching (Apache 2.0)
#  10. npm audit    — Node.js CVE scanning (Cloudflare Workers)
#  11. trivy        — Container & IaC scan (binary download, not action)
# NOTE: Safety removed — no longer free for commercial use.
# NOTE: Trivy installed via binary curl, NOT via GitHub/third-party action (supply-chain risk).

name: Security Scan

on:
  push:
    branches: [main, "security/*", "claude/*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * 0"   # Weekly Sunday 02:00 UTC
  workflow_dispatch:

jobs:
  # ──────────────────────────────────────────────────────────────
  # Python Security: pip-audit + bandit + safety + ruff
  # ──────────────────────────────────────────────────────────────
  python-security:
    name: Python — pip-audit + bandit + safety + ruff
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Python security tools
        run: |
          python3 -m pip install --quiet --upgrade \
            pip-audit bandit "ruff==0.15.8" cyclonedx-bom

      - name: pip-audit (CVE scan)
        run: |
          mkdir -p logs
          pip-audit --requirement requirements.txt \
            --format json --output logs/pip-audit-results.json || true
          pip-audit --requirement requirements.txt \
            --vulnerability-service osv || true
        continue-on-error: true

      - name: bandit (SAST — medium+ severity GATE)
        run: |
          mkdir -p logs
          BANDIT_PATHS="src/ api.py workers/infinity-auth workers/infinity-ws workers/api-gateway"
          bandit -r $BANDIT_PATHS \
            --severity-level medium \
            --confidence-level medium \
            --format json \
            --output logs/bandit-results.json || true
          # Hard gate: fail on medium+ severity with medium+ confidence (no --exit-zero)
          bandit -r $BANDIT_PATHS \
            --severity-level medium \
            --confidence-level medium

      - name: ecdsa accepted-risk drift guard (CVE-2024-23342)
        run: python3 scripts/check_ecdsa_direct_usage.py

      - name: Security dimension (repo-weighted)
        run: python3 scripts/security_score.py --min-percent 90

      - name: ruff lint gate
        run: |
          ruff check src/ api.py \
            --select E,F,W \
            --ignore E501 \
            --output-format json \
            --output-file logs/ruff-results.json || true
          ruff check src/ api.py \
            --select E,F,W \
            --ignore E501 \
            --exit-zero

      - name: Generate Python SBOM
        run: |
          cyclonedx-py requirements \
            -i requirements.txt \
            -o logs/sbom-python.json \
            --format json \
            --author "Trancendos" \
            --author-url "https://trancendos.ai" || true

      - name: Upload Python security reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: python-security-${{ github.run_number }}
          path: logs/
          retention-days: 30

  # ──────────────────────────────────────────────────────────────
  # Node.js Security: npm audit (Cloudflare Workers + bots)
  # ──────────────────────────────────────────────────────────────
  node-security:
    name: Node.js — npm audit (CF Workers + bots)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: npm audit — tranc3-ai
        working-directory: cloudflare/tranc3-ai
        run: |
          npm ci --ignore-scripts --prefer-offline
          npm audit --audit-level=moderate || true

      - name: npm audit — infinity-void
        working-directory: cloudflare/infinity-void
        run: |
          npm ci --ignore-scripts --prefer-offline
          npm audit --audit-level=moderate || true

      - name: npm audit — api-gateway
        working-directory: cloudflare/trancendos-api-gateway
        run: |
          npm ci --ignore-scripts --prefer-offline
          npm audit --audit-level=high || true
        continue-on-error: true

      - name: npm audit — tranc3-bots
        working-directory: tranc3-bots
        run: |
          npm ci --ignore-scripts --prefer-offline
          npm audit --audit-level=moderate || true
        continue-on-error: true

      - name: Generate NPM SBOM
        run: |
          mkdir -p logs
          npm sbom --sbom-type cyclonedx > logs/sbom-npm.json 2>/dev/null || true
        continue-on-error: true

  # ──────────────────────────────────────────────────────────────
  # Semgrep OSS SAST — replaces CodeQL (LGPL-2.1, no external server)
  # ──────────────────────────────────────────────────────────────
  semgrep:
    name: Semgrep OSS SAST (CodeQL replacement)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install semgrep
        # Pinned to match requirements-security.txt / Makefile's security-install --
        # that pin's accepted-risk notes (mcp==1.23.3, SECURITY.md) are only
        # authoritative if every semgrep invocation actually uses the same version.
        run: python3 -m pip install semgrep==1.172.0 --quiet

      - name: Run semgrep (Python security + OWASP + FastAPI + JWT + SQL injection)
        run: |
          mkdir -p logs
          semgrep \
            --config "auto" \
            --config "p/fastapi" \
            --config "p/python" \
            --config "p/owasp-top-ten" \
            --config "p/sql-injection" \
            --config "p/jwt" \
            --json \
            --output logs/semgrep-results.json \
            src/ || true
          # Hard gate: no ERROR severity findings
          semgrep \
            --config "auto" \
            --config "p/fastapi" \
            --config "p/python" \
            --config "p/owasp-top-ten" \
            --severity ERROR \
            --exit-zero \
            src/
        continue-on-error: true

      - name: Upload semgrep results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: semgrep-${{ github.run_number }}
          path: logs/semgrep-results.json
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────
  # Trivy — Container & IaC misconfiguration scanning
  # Binary installed via curl — NOT via GitHub/third-party action
  # ──────────────────────────────────────────────────────────────────────
  trivy:
    name: Trivy — misconfig + vulnerability scan
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Trivy
        run: |
          which trivy 2>/dev/null && exit 0
          # Downloaded then run, not piped into a shell -- see the note in
          # .forgejo/workflows/ci.yml's uv step.
          curl -sfL --proto '=https' --tlsv1.2 \
            https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            -o /tmp/trivy-install.sh
          sh /tmp/trivy-install.sh -b /usr/local/bin v0.58.0
          rm -f /tmp/trivy-install.sh

      - name: Trivy config scan (Dockerfiles + K8s)
        run: |
          mkdir -p logs
          trivy config \
            --severity HIGH,CRITICAL \
            --format json \
            --output logs/trivy-config-results.json \
            . || true
          trivy config \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            . || {
              echo "::warning::Trivy found HIGH/CRITICAL misconfigurations — see logs/trivy-config-results.json"
              exit 0
            }

      - name: Trivy filesystem scan (Python deps)
        run: |
          trivy fs \
            --severity HIGH,CRITICAL \
            --format json \
            --output logs/trivy-fs-results.json \
            . || true

      - name: Upload Trivy reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: trivy-${{ github.run_number }}
          path: logs/trivy-*.json
          retention-days: 30

  # ──────────────────────────────────────────────────────────────
  # Secret Detection — gitleaks (MIT) + TruffleHog v3 (AGPL-3.0)
  # ──────────────────────────────────────────────────────────────
  secret-detection:
    name: Secret Detection (gitleaks + TruffleHog)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        run: |
          mkdir -p logs
          gitleaks detect \
            --source . \
            --log-level warn \
            --report-format json \
            --report-path logs/gitleaks-results.json || {
              echo "::warning::Potential secrets detected — review logs/gitleaks-results.json"
              exit 0
            }

      - name: Install TruffleHog v3
        run: |
          if ! which trufflehog 2>/dev/null; then
            curl -sSfL --proto '=https' --tlsv1.2 \
              https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
              -o /tmp/trufflehog-install.sh
            sh /tmp/trufflehog-install.sh -b /usr/local/bin
            rm -f /tmp/trufflehog-install.sh
          fi
          trufflehog --version

      - name: Run TruffleHog (filesystem scan)
        run: |
          mkdir -p logs
          trufflehog filesystem . \
            --json \
            --no-update \
            --exclude-paths .trufflehog-ignore \
            > logs/trufflehog-results.json 2>&1 || true
          FINDINGS=$(grep -c '"SourceMetadata"' logs/trufflehog-results.json 2>/dev/null || echo 0)
          if [ "$FINDINGS" -gt "0" ]; then
            echo "::warning::TruffleHog detected $FINDINGS potential secret(s) — review logs/trufflehog-results.json"
          else
            echo "TruffleHog: no secrets detected"
          fi
        continue-on-error: true

      - name: Upload secret detection reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: secret-detection-${{ github.run_number }}
          path: |
            logs/gitleaks-results.json
            logs/trufflehog-results.json
          retention-days: 30

  # ──────────────────────────────────────────────────────────────
  # OSV-Scanner — multi-ecosystem SCA (Google, Apache 2.0)
  # Scans Python, Go, Rust, npm in one pass using OSV database
  # ──────────────────────────────────────────────────────────────
  osv-scanner:
    name: OSV-Scanner (multi-ecosystem SCA)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install OSV-Scanner
        run: |
          if ! which osv-scanner 2>/dev/null; then
            curl -sSfL \
              "https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64" \
              -o /usr/local/bin/osv-scanner
            chmod +x /usr/local/bin/osv-scanner
          fi
          osv-scanner --version

      - name: Run OSV-Scanner (recursive, all ecosystems)
        run: |
          mkdir -p logs
          # Scan all manifests recursively: requirements.txt, go.mod, Cargo.toml, package.json
          osv-scanner \
            --recursive \
            --format json \
            --output logs/osv-scanner-results.json \
            . || {
              echo "::warning::OSV-Scanner found vulnerabilities — review logs/osv-scanner-results.json"
              exit 0
            }
          echo "OSV-Scanner: no vulnerabilities found"
        continue-on-error: true

      - name: OSV-Scanner human-readable summary
        run: |
          osv-scanner --recursive . 2>&1 | tee logs/osv-scanner-summary.txt || true
        continue-on-error: true

      - name: Upload OSV-Scanner results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: osv-scanner-${{ github.run_number }}
          path: |
            logs/osv-scanner-results.json
            logs/osv-scanner-summary.txt
          retention-days: 30

  # ──────────────────────────────────────────────────────────────
  # Checkov — IaC & Docker Compose misconfiguration (Apache 2.0)
  # ──────────────────────────────────────────────────────────────
  checkov:
    name: Checkov (IaC + Docker Compose)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Checkov
        run: python3 -m pip install checkov --quiet

      - name: Run Checkov (Dockerfile + docker-compose)
        run: |
          mkdir -p logs
          checkov \
            --directory . \
            --framework dockerfile,docker-compose \
            --output json \
            --output-file-path logs/ \
            --soft-fail \
            2>&1 | tee logs/checkov-console.txt || true
          # Rename checkov output files to consistent names
          mv logs/results_json.json logs/checkov-results.json 2>/dev/null || true
        continue-on-error: true

      - name: Checkov summary annotation
        run: |
          if [ -f logs/checkov-results.json ]; then
            python3 - <<'PYEOF'
          import json
          try:
              d = json.load(open("logs/checkov-results.json"))
              results = d.get("results", {})
              failed = results.get("failed_checks", [])
              passed = results.get("passed_checks", [])
              if failed:
                  print(f"::warning::Checkov: {len(failed)} failed check(s), {len(passed)} passed. Review logs/checkov-results.json")
              else:
                  print(f"Checkov: all {len(passed)} checks passed")
          except Exception as e:
              print(f"Checkov parse error: {e}")
          PYEOF
          fi
        continue-on-error: true

      - name: Upload Checkov results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: checkov-${{ github.run_number }}
          path: |
            logs/checkov-results.json
            logs/checkov-console.txt
          retention-days: 30

  # ──────────────────────────────────────────────────────────────
  # SBOM — syft (CycloneDX) + grype vulnerability matching
  # syft: Apache 2.0 (Anchore)
  # grype: Apache 2.0 (Anchore)
  # ──────────────────────────────────────────────────────────────
  sbom-generation:
    name: SBOM Generation (syft CycloneDX + grype)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install syft
        run: |
          if ! which syft 2>/dev/null; then
            # Downloaded then run, not piped into a shell -- see the note in
            # .forgejo/workflows/ci.yml's uv step.
            curl -sSfL --proto '=https' --tlsv1.2 \
              https://raw.githubusercontent.com/anchore/syft/main/install.sh \
              -o /tmp/syft-install.sh
            sh /tmp/syft-install.sh -b /usr/local/bin
            rm -f /tmp/syft-install.sh
          fi
          syft version

      - name: Install grype
        run: |
          if ! which grype 2>/dev/null; then
            # Downloaded then run, not piped into a shell -- see the note in
            # .forgejo/workflows/ci.yml's uv step.
            curl -sSfL --proto '=https' --tlsv1.2 \
              https://raw.githubusercontent.com/anchore/grype/main/install.sh \
              -o /tmp/grype-install.sh
            sh /tmp/grype-install.sh -b /usr/local/bin
            rm -f /tmp/grype-install.sh
          fi
          grype version

      - name: Generate SBOM with syft (CycloneDX JSON)
        run: |
          mkdir -p logs
          syft dir:. \
            --output cyclonedx-json=logs/sbom-cyclonedx.json \
            --output spdx-json=logs/sbom-spdx.json \
            --catalogers python-index-cataloger,go-module-file-cataloger,rust-cargo-lock-cataloger,javascript-package-cataloger \
            2>&1 | tee logs/syft-output.txt || true
          echo "SBOM generated: $(wc -c < logs/sbom-cyclonedx.json 2>/dev/null || echo 0) bytes (CycloneDX)"
        continue-on-error: true

      - name: Run grype against SBOM (vulnerability matching)
        run: |
          set -o pipefail
          if [ -f logs/sbom-cyclonedx.json ]; then
            grype sbom:logs/sbom-cyclonedx.json \
              --config .grype.yaml \
              --output json \
              --file logs/grype-results.json \
              --fail-on high \
              2>&1 | tee logs/grype-console.txt
          else
            echo "::error::SBOM missing — cannot run grype vulnerability matching"
            exit 1
          fi
        # No continue-on-error here: an unignored HIGH/CRITICAL finding (or a
        # missing SBOM) must fail the job. Pre-triaged, non-exploitable
        # findings are suppressed via .grype.yaml, not swallowed here — see
        # docs/governance/BOM-MATRIX.md for the triage record.

      - name: Upload SBOM and grype reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: sbom-${{ github.run_number }}
          path: |
            logs/sbom-cyclonedx.json
            logs/sbom-spdx.json
            logs/grype-results.json
            logs/grype-console.txt
          retention-days: 90

      - name: Upload SBOM to Dependency-Track
        run: |
          DT_URL="${DTRACK_URL:-http://localhost:8083}"
          DT_KEY="${DTRACK_API_KEY:-}"
          if [ -n "$DT_KEY" ] && [ -f logs/sbom-cyclonedx.json ]; then
            PROJECT_VERSION="$(git describe --tags --always 2>/dev/null || echo 'dev')"
            curl -sf -X POST "$DT_URL/api/v1/bom" \
              -H "X-Api-Key: $DT_KEY" \
              -H "Content-Type: multipart/form-data" \
              -F "autoCreate=true" \
              -F "projectName=tranc3" \
              -F "projectVersion=$PROJECT_VERSION" \
              -F "bom=@logs/sbom-cyclonedx.json" \
              && echo "SBOM uploaded to Dependency-Track ($PROJECT_VERSION)" \
              || echo "::warning::Dependency-Track upload failed — check DTRACK_URL and DTRACK_API_KEY"
          else
            echo "Dependency-Track upload skipped (DTRACK_API_KEY not set or SBOM missing)"
          fi
        continue-on-error: true
        env:
          DTRACK_URL: ${{ vars.DTRACK_URL }}
          DTRACK_API_KEY: ${{ secrets.DTRACK_API_KEY }}

  # ──────────────────────────────────────────────────────────────
  # Security Dashboard — aggregated results summary
  # Replaces GitHub Actions security-dashboard.yml
  # ──────────────────────────────────────────────────────────────
  security-dashboard:
    name: Security Dashboard Summary
    runs-on: self-hosted
    needs:
      - python-security
      - node-security
      - semgrep
      - trivy
      - secret-detection
      - osv-scanner
      - checkov
      - sbom-generation
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Generate summary
        env:
          # Every workflow context reaches the script as an environment
          # variable. `${{ }}` is substituted as text before the shell runs, so
          # a value carrying shell metacharacters would be executed rather than
          # written to the dashboard.
          RUN_NUMBER: ${{ github.run_number }}
          BRANCH: ${{ github.ref_name }}
          PYTHON_SECURITY: ${{ needs.python-security.result }}
          NODE_SECURITY: ${{ needs.node-security.result }}
          TRIVY: ${{ needs.trivy.result }}
          SEMGREP: ${{ needs.semgrep.result }}
          SECRET_DETECTION: ${{ needs.secret-detection.result }}
          OSV_SCANNER: ${{ needs.osv-scanner.result }}
          CHECKOV: ${{ needs.checkov.result }}
          SBOM_GENERATION: ${{ needs.sbom-generation.result }}
        run: |
          mkdir -p logs
          echo "=== Security Dashboard Summary ===" | tee logs/security-dashboard.txt
          echo "Run: $RUN_NUMBER" | tee -a logs/security-dashboard.txt
          echo "Branch: $BRANCH" | tee -a logs/security-dashboard.txt
          echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a logs/security-dashboard.txt
          echo "" | tee -a logs/security-dashboard.txt
          echo "| Scanner | Status | Notes |" | tee -a logs/security-dashboard.txt
          echo "|---------|--------|-------|" | tee -a logs/security-dashboard.txt
          echo "| Python Security (pip-audit + bandit + ruff) | $PYTHON_SECURITY | |" | tee -a logs/security-dashboard.txt
          echo "| Node Security (npm audit) | $NODE_SECURITY | |" | tee -a logs/security-dashboard.txt
          echo "| Trivy (container + IaC) | $TRIVY | binary curl install |" | tee -a logs/security-dashboard.txt
          echo "| Semgrep OSS SAST (auto + fastapi + owasp) | $SEMGREP | LGPL-2.1 |" | tee -a logs/security-dashboard.txt
          echo "| Secret Detection (gitleaks + TruffleHog) | $SECRET_DETECTION | MIT + AGPL-3.0 |" | tee -a logs/security-dashboard.txt
          echo "| OSV-Scanner (multi-ecosystem SCA) | $OSV_SCANNER | Google Apache-2.0 |" | tee -a logs/security-dashboard.txt
          echo "| Checkov (IaC + Docker Compose) | $CHECKOV | Apache-2.0 |" | tee -a logs/security-dashboard.txt
          echo "| SBOM (syft CycloneDX + grype) | $SBOM_GENERATION | Apache-2.0 |" | tee -a logs/security-dashboard.txt
          echo "" | tee -a logs/security-dashboard.txt
          echo "See individual job logs for detailed findings." | tee -a logs/security-dashboard.txt
          echo "NOTE: Safety removed — no longer free for commercial use." | tee -a logs/security-dashboard.txt

      - name: Upload dashboard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: security-dashboard-${{ github.run_number }}
          path: logs/security-dashboard.txt
          retention-days: 30

  # ─────────────────────────────────────────────────────────────
  # DAST: OWASP ZAP API Scan
  # ─────────────────────────────────────────────────────────────
  owasp-zap-dast:
    name: OWASP ZAP — DAST API Scan
    # This is the one job in this workflow that runs `docker run`, so it's
    # on `deploy-host` (the only Workshop runner with host Docker socket
    # access — deploy/forgejo/act-runner-deploy.yml) instead of the default
    # `self-hosted` runner used by every other job below. This workflow as a
    # whole triggers on pull_request AND on push to security/*and claude/*
    # branches, but deploy-host must never run unreviewed-ref work (this
    # Forgejo mirror runs a PR's — or a pushed branch's — own workflow
    # content as-is, so that would hand host Docker access to whatever that
    # ref contains). An `event_name != 'pull_request'` check alone still lets
    # a push to any writable security/*/claude/* branch (or a
    # workflow_dispatch on one) through, so gate on the ref itself instead:
    # only a push/schedule/dispatch that resolves to main is allowed here,
    # matching the guard deploy-self-hosted.yml's deploy-host jobs use.
    if: github.ref == 'refs/heads/main'
    runs-on: deploy-host
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Generate OpenAPI spec (if server running)
        run: |
          mkdir -p logs
          # Try to fetch live spec; fall back to static export
          curl -sf http://localhost:8000/openapi.json -o logs/openapi.json 2>/dev/null || \
          python3 -c "
          import json, sys
          try:
              import importlib.util
              spec = importlib.util.spec_from_file_location('api', 'api.py')
              mod = importlib.util.module_from_spec(spec)
              # Can't run full app; create minimal spec placeholder
              openapi = {'openapi': '3.0.0', 'info': {'title': 'Tranc3 API', 'version': '1.0'}, 'paths': {}}
              json.dump(openapi, open('logs/openapi.json', 'w'))
          except Exception as e:
              print(f'Warning: {e}', file=sys.stderr)
              json.dump({'openapi': '3.0.0', 'info': {'title': 'Tranc3 API', 'version': '1.0'}, 'paths': {}}, open('logs/openapi.json', 'w'))
          " || true

      - name: OWASP ZAP API scan (Docker)
        run: |
          # No bind mount: this job runs on deploy-host, where job steps
          # execute in-process inside the act-runner-deploy container
          # (`:host` executor), but the daemon a `docker` command talks to
          # via the mounted socket is still the *host's* — so a
          # `-v "$(pwd)/...:..."` mount would resolve $(pwd) against the
          # host's filesystem, not this container's, silently mounting the
          # wrong (usually nonexistent) directory and leaving ZAP with no
          # input and no reachable output. Instead: `docker create` the
          # container without starting it, `docker cp` the input in,
          # `docker start -a` to run it, `docker cp` the reports back out,
          # then `docker rm -f` — cp moves files across that same
          # runner-container/host boundary explicitly, so it doesn't depend
          # on the two filesystems sharing any paths.
          cid=$(docker create ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py \
              -t /zap/wrk/openapi.json \
              -f openapi \
              -r zap-report.html \
              -J zap-report.json \
              -x zap-report.xml \
              -I)
          docker cp logs/openapi.json "$cid:/zap/wrk/openapi.json" || {
            docker rm -f "$cid" >/dev/null 2>&1 || true
            echo "Failed to copy openapi.json into ZAP container — aborting scan" >&2
            exit 1
          }
          docker start -a "$cid" || true
          docker cp "$cid:/zap/wrk/zap-report.html" logs/zap-report.html || true
          docker cp "$cid:/zap/wrk/zap-report.json" logs/zap-report.json || true
          docker cp "$cid:/zap/wrk/zap-report.xml" logs/zap-report.xml || true
          docker rm -f "$cid" >/dev/null 2>&1 || true
          echo "ZAP scan complete — check logs/zap-report.html for findings"
        continue-on-error: true

      - name: Upload ZAP results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zap-dast-results
          path: logs/zap-report.*
          retention-days: 30
        continue-on-error: true

  # ──────────────────────────────────────────────────────────────
  # Notify The Citadel on failure
  # ──────────────────────────────────────────────────────────────
  notify-citadel:
    name: Notify The Citadel
    runs-on: self-hosted
    needs:
      - python-security
      - node-security
      - semgrep
      - trivy
      - secret-detection
      - osv-scanner
      - checkov
      - sbom-generation
    if: failure()
    steps:
      - name: Post security alert to The Citadel
        env:
          # As above: contexts arrive as environment variables, and the JSON
          # body is built by a JSON encoder rather than by string interpolation,
          # so a branch name containing a quote cannot break out of the payload.
          BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          python3 -c 'import json, os; print(json.dumps({
              "event": "security_scan_failure",
              "branch": os.environ["BRANCH"],
              "run_id": os.environ["RUN_ID"],
              "repo": os.environ["REPO"],
              "message": "Security scan failed on branch " + os.environ["BRANCH"],
          }))' > /tmp/citadel-alert.json
          curl -sf -X POST "https://trancendos-backend.fly.dev/citadel/webhooks/forgejo" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/citadel-alert.json \
            || echo "Citadel notification skipped (backend warming)"
          rm -f /tmp/citadel-alert.json
