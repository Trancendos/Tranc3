# .forgejo/workflows/security-baseline.yml
# Security Baseline Tracker — enforces that new code never REGRESSES the
# security posture. On every push:
#
#   1. Runs bandit and captures the finding count.
#   2. Fails the build if the count EXCEEDS the current baseline stored in
#      .security-baseline (checked into the repo and updated automatically
#      when the baseline improves).
#   3. Updates the baseline file and auto-commits when the count DECREASES.
#
# This replaces the previous "gate on 0 bandit findings" approach, which
# was unworkable given ~866 pre-existing alerts across the codebase. The
# ratchet approach guarantees monotonic improvement without blocking normal
# development work.
#
# Additional gates (non-ratchet, hard-fail):
#   - pip-audit: any HIGH/CRITICAL CVE in runtime requirements → fail
#   - gitleaks: any new secret detection → fail
#   - trivy: any new CRITICAL misconfiguration in Dockerfiles → fail
#
# Zero-cost tools only (no paid API calls, no SaaS).
#
# Runs: on every push/PR to main and all feature branches.

name: Security Baseline

on:
  push:
    branches: [main, "claude/*", "security/*", "fix/*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # Ratchet: bandit finding count must never increase
  # ──────────────────────────────────────────────────────────────────────
  bandit-ratchet:
    name: Bandit Ratchet (no regression)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.FORGEJO_TOKEN || github.token }}

      # Delegates to scripts/check_bandit_coverage.py, which GitHub Actions'
      # ci.yml also runs. This job previously carried ~130 lines of shell
      # implementing its own ratchet, and it had four problems at once:
      #
      #   1. It has never run. All four jobs here pin `runs-on: self-hosted`,
      #      against an act-runner the cloud-only phase defers.
      #   2. It passed no `-c pyproject.toml`, so [tool.bandit] skips never
      #      applied. Of the 309 findings its documented command reports,
      #      147 are B311 and 101 are B110 -- both skipped in pyproject.toml
      #      with written reasons. 248 of 309 were already adjudicated.
      #   3. `.security-baseline` had drifted from 307 to 309 undetected,
      #      because the workflow that checks drift is this one.
      #   4. Its scope was `src api.py workers/tateking/main.py` -- one worker
      #      file out of roughly eighty.
      #
      # The shared script fixes all four: scope comes from [tool.bandit]
      # targets, the config is always loaded, the ceiling lives in
      # config/immune/bandit_ceiling.txt, and a run that could not scan
      # reports UNKNOWN instead of clean. Two callers, one implementation,
      # so they cannot disagree about what "holding" means.
      - name: Install bandit
        # PyYAML as well as bandit: `check_bandit_coverage.py` reads
        # `.pre-commit-config.yaml` to compare the two bandit lanes, and
        # `bandit[toml]` does not pull YAML support in (bandit ships that as a
        # separate `yaml` extra). Without it the checker reports the lane
        # comparison as unreadable and exits 1 -- a job failing on a missing
        # dependency rather than on a finding. The GitHub copy in ci.yml
        # already installs it; this one did not, and Forgejo's dormancy is the
        # only reason that had not been seen. Raised by coderabbit on #1403.
        run: python3 -m pip install --quiet "bandit[toml]==1.9.4" PyYAML

      - name: bandit covers the whole configured surface
        run: python3 scripts/check_bandit_coverage.py

  # ──────────────────────────────────────────────────────────────────────
  # Hard gate: no new HIGH/CRITICAL CVEs in runtime requirements
  # ──────────────────────────────────────────────────────────────────────
  dependency-gate:
    name: Dependency CVE Gate (fixable vulns → fail)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pip-audit
        run: python3 -m pip install --quiet pip-audit

      - name: pip-audit (HIGH/CRITICAL only)
        run: |
          mkdir -p logs
          pip-audit --requirement requirements.txt \
            --format json --output logs/pip-audit.json 2>/dev/null || true

          # Count HIGH and CRITICAL findings with available fixes
          CRITICAL=$(python3 -c "
          import json, sys, os
          if not os.path.exists('logs/pip-audit.json'):
              print('Error: logs/pip-audit.json not found', file=sys.stderr)
              sys.exit(1)
          try:
              with open('logs/pip-audit.json') as f:
                  data = json.load(f)
              # Only count HIGH/CRITICAL severity vulns with available fixes
              HIGH_SEVERITIES = {'high', 'critical'}
              highs = [v for dep in data.get('dependencies', [])
                       for v in dep.get('vulns', [])
                       if v.get('fix_versions') and
                          v.get('severity', '').lower() in HIGH_SEVERITIES]
              print(len(highs))
          except Exception as e:
              print(f'Error parsing pip-audit output: {e}', file=sys.stderr)
              sys.exit(1)
          ")
          echo "Actionable HIGH/CRITICAL CVEs (with fix versions): $CRITICAL"
          if [ "$CRITICAL" -gt "0" ]; then
            echo "❌ $CRITICAL HIGH/CRITICAL CVE(s) with available fixes — update requirements.txt"
            python3 -c "
          import json, sys, os
          with open('logs/pip-audit.json') as f:
              data = json.load(f)
          HIGH_SEVERITIES = {'high', 'critical'}
          for dep in data.get('dependencies', []):
              for v in dep.get('vulns', []):
                  if v.get('fix_versions') and v.get('severity', '').lower() in HIGH_SEVERITIES:
                      print(f\"  {dep['name']} {dep['version']}: {v['id']} ({v.get('severity','?')}) — fix: {v['fix_versions']}\")
          "
            exit 1
          fi
          echo "✅ No HIGH/CRITICAL CVEs with available fix versions"

  # ──────────────────────────────────────────────────────────────────────
  # Hard gate: no new secrets in the diff
  # ──────────────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Detection Gate
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Run gitleaks on changed files
        run: |
          # Install gitleaks if not cached
          if ! command -v gitleaks &>/dev/null; then
            curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
              | tar -xz -C /usr/local/bin gitleaks 2>/dev/null || true
          fi

          mkdir -p logs
          gitleaks git \
            --config .gitleaks.toml \
            --report-format json \
            --report-path logs/gitleaks.json \
            --log-level warn \
            --no-banner \
            --exit-code 1 2>/dev/null && echo "✅ No secrets detected in diff" || {
            echo "❌ Secrets detected — review logs/gitleaks.json"
            python3 -c "
          import json
          try:
              findings = json.load(open('logs/gitleaks.json'))
              for f in findings[:10]:
                  print(f\"  {f.get('File','')}:{f.get('StartLine','')} — {f.get('RuleID','')}\")
          except Exception:
              pass
          "
            exit 1
          }

  # ──────────────────────────────────────────────────────────────────────
  # Summary report — aggregates all job results into a dashboard artifact
  # ──────────────────────────────────────────────────────────────────────
  security-summary:
    name: Security Summary
    needs: [bandit-ratchet, dependency-gate, secret-scan]
    if: always()
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Generate summary
        run: |
          echo "## Security Baseline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Gate | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Bandit ratchet | ${{ needs.bandit-ratchet.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency CVEs | ${{ needs.dependency-gate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secret detection | ${{ needs.secret-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Baseline file: \`.security-baseline\`" >> $GITHUB_STEP_SUMMARY
