name: Frontend Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'cloudflare/pages/**'
      - 'docker/Dockerfile.web'
      - 'docker/nginx.conf'
  pull_request:
    paths:
      - 'web/**'
      - 'docker/Dockerfile.web'
      - 'docker/nginx.conf'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Install Playwright browser (Storybook a11y tests)
        run: npx playwright install --with-deps chromium

      - name: Storybook component + a11y tests
        run: npm run test

      - name: Build production bundle
        run: npm run build
        env:
          VITE_API_URL: 'https://api.trancendos.com'
          VITE_ECOSYSTEM_API_URL: 'https://api.trancendos.com'

      - name: Verify dist output
        run: |
          test -f dist/index.html || (echo "✗ dist/index.html missing" && exit 1)
          test -d dist/assets   || (echo "✗ dist/assets missing" && exit 1)
          echo "✓ dist/index.html present"
          du -sh dist/
          ls -lh dist/assets/

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tranc3-web-dist
          path: web/dist/
          retention-days: 7

  deploy-pages:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tranc3-web-dist
          path: web/dist

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy to Cloudflare Pages
        run: wrangler pages deploy web/dist --project-name=trancendos-frontend --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

  docker:
    runs-on: ubuntu-latest
    needs: build
    # Deliberately NOT main-only. The pull_request trigger above includes
    # docker/Dockerfile.web and docker/nginx.conf, and this is the only job that
    # builds and smoke-tests the image — gating it on main meant a PR touching
    # those exact files never validated them, and the first real build happened
    # after merge. This job has no external side effect, so it is safe on PRs.
    # Matches the sibling .github/workflows/frontend-build.yml.

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build Docker image
        run: docker build -t tranc3-web:${{ github.sha }} -f docker/Dockerfile.web .

      - name: Smoke test container
        run: |
          # Clear any container left behind by an earlier run. This runner is
          # self-hosted and keeps Docker state between jobs, so a leftover
          # tranc3-web-test would fail the next run on a name conflict before a
          # single assertion executed.
          docker rm -f tranc3-web-test >/dev/null 2>&1 || true
          docker run -d --name tranc3-web-test -p 3000:80 tranc3-web:${{ github.sha }}
          # Remove on every exit path, including the failure branches below.
          # Deliberately a trap rather than `docker run --rm`: --rm deletes a
          # container the instant it dies, so `docker logs` would come back empty
          # for a container that crashed at startup — which is exactly the failure
          # this test exists to catch (it is how the /var/cache/nginx permission
          # bug was found). The trap runs after the logs have been read.
          trap 'docker rm -f tranc3-web-test >/dev/null 2>&1 || true' EXIT
          sleep 3
          # /health, not /healthz — nginx.conf defines `location /health`, while
          # `location /` does try_files ... /index.html. A request to /healthz
          # therefore falls through to the SPA and returns 200, so the old probe
          # passed without ever reaching the health endpoint. Assert the body is
          # exactly "ok" so an index.html fallback cannot satisfy it either.
          body=$(curl -sf http://localhost:3000/health) \
            || (docker logs tranc3-web-test && exit 1)
          [ "$body" = "ok" ] \
            || (echo "✗ /health returned '$body', expected 'ok'" && docker logs tranc3-web-test && exit 1)
          curl -sf http://localhost:3000/ | grep -q "<!DOCTYPE html>" || exit 1
          echo "✓ Container smoke test passed"
