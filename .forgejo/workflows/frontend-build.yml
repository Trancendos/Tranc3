name: Frontend Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'cloudflare/pages/**'
      - 'docker/Dockerfile.web'
      - 'docker/nginx.conf'
      - '.forgejo/workflows/frontend-build.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'docker/Dockerfile.web'
      - 'docker/nginx.conf'
      - '.forgejo/workflows/frontend-build.yml'
  # The GitHub copy has always had this; without it there is no way to run
  # this build on Forgejo by hand.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Do not leave the checkout token in .git/config for later
          # steps to read or push with. The GitHub copy has always set
          # this; this one had not.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        # --ignore-scripts blocks package lifecycle hooks, the step the recent
        # npm supply-chain worms (Shai-Hulud, PhantomRaven) moved their payload
        # into. Verified safe for this tree: the only install scripts in
        # web/package-lock.json are core-js (a funding banner), fsevents
        # (macOS-only, inert on Linux runners) and esbuild -- whose platform
        # binary arrives via optionalDependencies (@esbuild/linux-x64), not via
        # its install script, so the production build is unaffected. Playwright's
        # browser download is the explicit step below.
        run: npm ci --ignore-scripts

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Install Playwright browser (Storybook a11y tests)
        run: npx playwright install --with-deps chromium

      - name: Storybook component + a11y tests
        run: npm run test

      - name: Build production bundle
        run: npm run build
        env:
          VITE_API_URL: 'https://api.trancendos.com'
          VITE_ECOSYSTEM_API_URL: 'https://api.trancendos.com'

      - name: Verify dist output
        run: |
          test -f dist/index.html || (echo "✗ dist/index.html missing" && exit 1)
          test -d dist/assets   || (echo "✗ dist/assets missing" && exit 1)
          echo "✓ dist/index.html present"
          du -sh dist/
          ls -lh dist/assets/

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tranc3-web-dist
          path: web/dist/
          retention-days: 7

  deploy-pages:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.ref == 'refs/heads/main' }}

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tranc3-web-dist
          path: web/dist

      # Credential guard, matching the sibling .github copy. Without it a missing
      # secret surfaces as a confusing wrangler auth error deep in the deploy
      # rather than a plain statement of what is unset. The skip is deliberately
      # loud: a green job that deployed nothing is worse than a red one, so the
      # run summary states outright whether anything shipped.
      - name: Check Cloudflare credentials
        id: creds
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "::warning::CF_API_TOKEN / CF_ACCOUNT_ID not set — NOT deploying to Pages."
            echo "present=false" >> "$GITHUB_OUTPUT"
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              {
                echo "## ⚠️ Frontend was NOT deployed"
                echo
                echo "The bundle built, but no deploy happened — \`CF_API_TOKEN\` and/or"
                echo "\`CF_ACCOUNT_ID\` are unset. trancendos.com is unchanged."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Wrangler
        if: steps.creds.outputs.present == 'true'
        # Pinned to the fleet-wide version in cloudflare/DEPLOY.md — an unpinned
        # global install lets a new major change deploy behaviour with no
        # corresponding change in this repo.
        run: npm install -g wrangler@4.102.0

      - name: Deploy to Cloudflare Pages
        if: steps.creds.outputs.present == 'true'
        run: |
          wrangler pages deploy web/dist --project-name=trancendos-frontend --commit-dirty=true
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "## ✅ Frontend deployed to Cloudflare Pages"
              echo
              echo "Project: \`trancendos-frontend\` — commit \`${GITHUB_SHA:0:8}\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

  docker:
    runs-on: ubuntu-latest
    needs: build
    # Deliberately NOT main-only. The pull_request trigger above includes
    # docker/Dockerfile.web and docker/nginx.conf, and this is the only job that
    # builds and smoke-tests the image — gating it on main meant a PR touching
    # those exact files never validated them, and the first real build happened
    # after merge. This job has no external side effect, so it is safe on PRs.
    # Matches the sibling .github/workflows/frontend-build.yml.

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Do not leave the checkout token in .git/config for later
          # steps to read or push with. The GitHub copy has always set
          # this; this one had not.
          persist-credentials: false

      - name: Build Docker image
        run: docker build -t tranc3-web:${{ github.sha }} -f docker/Dockerfile.web .

      - name: Smoke test container
        run: |
          # Clear any container left behind by an earlier run, and remove this
          # one on every exit path. ubuntu-latest runners are ephemeral per job
          # so this is not load-bearing here, but the Forgejo copy runs on a
          # self-hosted runner that keeps Docker state between jobs — where a
          # leftover container fails the next run on a name conflict. Kept
          # identical so the two copies stay in sync, as the header requires.
          #
          # A trap rather than `docker run --rm`: --rm deletes a container the
          # instant it dies, so `docker logs` would come back empty for one that
          # crashed at startup — exactly the failure this test exists to catch
          # (it is how the /var/cache/nginx permission bug was found). The trap
          # runs after the logs have been read.
          docker rm -f tranc3-web-test >/dev/null 2>&1 || true
          docker run -d --name tranc3-web-test -p 3000:80 tranc3-web:${{ github.sha }}
          trap 'docker rm -f tranc3-web-test >/dev/null 2>&1 || true' EXIT
          sleep 3
          # /health, not /healthz — nginx.conf defines `location /health`, while
          # `location /` does try_files ... /index.html. A request to /healthz
          # therefore falls through to the SPA and returns 200, so the old probe
          # passed without ever reaching the health endpoint. Assert the body is
          # exactly "ok" so an index.html fallback cannot satisfy it either.
          body=$(curl -sf http://localhost:3000/health) \
            || (docker logs tranc3-web-test && exit 1)
          [ "$body" = "ok" ] \
            || (echo "✗ /health returned '$body', expected 'ok'" && docker logs tranc3-web-test && exit 1)
          curl -sf http://localhost:3000/ | grep -q "<!DOCTYPE html>" || exit 1
          echo "✓ Container smoke test passed"
